<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Haushaltsbuch</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --line: #e8eaee;
    --text: #111827;
    --muted: #8b93a1;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
  }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: rgba(244,245,247,.86);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .brand { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 1.05rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    transition: transform .12s, background .12s;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.ghost { border-color: transparent; background: transparent; font-size: 1rem; color: var(--muted); }
  .icon-btn:disabled { opacity: .5; pointer-events: none; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 4px 16px calc(120px + env(safe-area-inset-bottom));
  }

  .hero { padding: 12px 4px 22px; }
  .hero-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .hero-total {
    display: block;
    font-size: clamp(2.2rem, 11vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    line-height: 1.05;
  }
  .hero-sub { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }

  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow .15s;
  }
  .entry-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .entry-main { flex: 1; min-width: 0; }
  .entry-merchant { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .entry-amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .entry-items { display: none; padding: 4px 16px 0; border-top: 1px solid var(--line); }
  .entry.open .entry-items { display: block; }
  .entry-item { display: flex; justify-content: space-between; gap: 12px; font-size: .85rem; color: #4b5563; padding: 6px 0; }
  .entry-item .price { font-variant-numeric: tabular-nums; color: var(--muted); }
  .entry-del {
    display: block;
    width: calc(100% + 32px);
    margin: 4px -16px 0;
    text-align: left;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: #ef4444;
    font: inherit;
    font-weight: 600;
    font-size: .85rem;
    padding: 14px 16px;
    cursor: pointer;
  }
  .entry-del:active { background: #fef2f2; }

  .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 56px 24px; }

  .fab {
    position: fixed;
    right: max(20px, calc(50vw - 280px + 20px));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: #fff;
    font-size: 1.9rem;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(59,130,246,.4);
    z-index: 30;
    transition: transform .12s, box-shadow .12s;
  }
  .fab:active { transform: scale(.9); }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(17,24,39,.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .26s cubic-bezier(.2,.9,.3,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  .sheet-backdrop.show .sheet { transform: translateY(0); }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #d1d5db; margin: 6px auto 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }

  .sheet-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    background: #f8f9fb;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    cursor: pointer;
    text-align: left;
  }
  .sheet-item:active { transform: scale(.98); }
  .sheet-item .ico { font-size: 1.3rem; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label, .field-label { font-size: .74rem; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=url], input[type=number], input[type=date], input[type=file], textarea, select {
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 12px 13px;
    width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }
  textarea { resize: vertical; min-height: 80px; }

  .row-inline { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row-inline .grow { flex: 1; min-width: 0; }
  .toggles { display: flex; gap: 16px; flex-wrap: wrap; margin: 4px 0 12px; }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: #374151; font-weight: 600; }
  .chk input { width: 20px; height: 20px; }

  .btn {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 700;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    transition: transform .12s, background .12s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:active { background: var(--accent-dark); }
  .btn.block { display: block; width: 100%; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn.ghost-add { border-style: dashed; color: var(--muted); background: transparent; margin-bottom: 14px; }

  .hint { font-size: .78rem; color: var(--muted); line-height: 1.45; margin: 4px 0 0; }
  .hint.error { color: #b91c1c; }
  .hint.ok { color: #047857; }

  .progress { margin: 10px 0 0; }
  .progress-track { height: 8px; border-radius: 999px; background: #eef0f3; overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s; }
  .progress.indeterminate .progress-bar { animation: indet 1.1s ease-in-out infinite; }
  @keyframes indet {
    0% { margin-left: -35%; }
    100% { margin-left: 100%; }
  }
  .progress-text { display: block; font-size: .76rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .drop {
    position: relative;
    border: 1.5px dashed #cbd5e1;
    border-radius: 16px;
    background: #f9fafb;
    min-height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .drop:hover, .drop.over { border-color: #60a5fa; background: #eff6ff; }
  .drop-inner { text-align: center; color: var(--muted); font-size: .9rem; padding: 24px; }
  .drop-icon { font-size: 2rem; margin-bottom: 8px; }
  #preview { display: block; max-width: 100%; height: auto; }

  .more { margin-bottom: 12px; }
  .more summary { font-size: .82rem; color: var(--muted); font-weight: 600; cursor: pointer; padding: 4px 0; }
  .more textarea { margin-top: 8px; }

  .notice {
    font-size: .82rem;
    color: #92400e;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }

  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .items-edit { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .item-edit { display: grid; grid-template-columns: 1fr 64px 96px 40px; gap: 8px; align-items: center; }
  .item-edit .btn.ghost { padding: 8px; font-size: 1rem; color: var(--muted); border: 0; background: transparent; }
  .review-actions { display: flex; gap: 10px; margin-top: 6px; }
  .review-actions .btn { flex: 1; }

  .scan-status { font-size: .85rem; color: var(--muted); padding: 12px 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: #111827;
    color: #fff;
    font-size: .85rem;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 60;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .settings-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }

  @media (max-width: 420px) {
    .review-grid { grid-template-columns: 1fr; }
    .item-edit { grid-template-columns: 1fr 1fr 40px; }
    .item-edit .it-name { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="icon-btn" id="back" href="/" aria-label="Zurück">←</a>
  <span class="brand">Haushaltsbuch</span>
  <button class="icon-btn" id="settings" aria-label="Einstellungen">⚙︎</button>
</header>

<main>
  <section class="hero">
    <span class="hero-label">Ausgaben gesamt</span>
    <span class="hero-total" id="grandTotal">0,00 €</span>
    <span class="hero-sub" id="receiptCount">Noch keine Belege</span>
  </section>
  <section id="book"></section>
</main>

<button class="fab" id="add" aria-label="Beleg hinzufügen">+</button>

<div class="sheet-backdrop" id="actionSheet">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <button class="sheet-item" id="scanAction"><span class="ico">📷</span> Beleg scannen</button>
    <button class="sheet-item" id="manualAction"><span class="ico">✏️</span> Manuell eintragen</button>
  </div>
</div>

<div class="sheet-backdrop" id="scanSheet">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 id="scanTitle">Beleg scannen</h2>
      <button class="icon-btn ghost" id="scanClose" aria-label="Schließen">✕</button>
    </div>

    <div id="scanInput">
      <div class="drop" id="drop">
        <canvas id="preview" hidden></canvas>
        <div class="drop-inner" id="dropInner">
          <div class="drop-icon">📷</div>
          <div>Foto aufnehmen oder wählen</div>
        </div>
      </div>
      <input id="file" type="file" accept="image/*" hidden>

      <details class="more">
        <summary>Kassenbon-Text einfügen</summary>
        <textarea id="ocrText" placeholder="Text hier einfügen…"></textarea>
      </details>

      <div class="notice" id="modelNotice" hidden>
        <span>Modell nicht geladen.</span>
        <button class="link" id="openSettings">Jetzt laden</button>
      </div>

      <button class="btn primary block" id="scan" disabled>Scannen</button>
      <div class="scan-status" id="scanStatus" hidden></div>
    </div>

    <div id="review" hidden></div>
  </div>
</div>

<div class="sheet-backdrop" id="settingsSheet">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>Einstellungen</h2>
      <button class="icon-btn ghost" id="settingsClose" aria-label="Schließen">✕</button>
    </div>

    <label class="field-label">Modell</label>
    <div class="row-inline">
      <input id="modelUrl" class="grow" type="url" placeholder="https://…/gemma-4-E4B-it-web.task">
      <button class="btn" id="loadModel">Laden</button>
    </div>
    <div class="row-inline">
      <input id="modelFile" class="grow" type="file" accept=".task,.bin,.litertlm">
    </div>
    <div class="toggles">
      <label class="chk"><input type="checkbox" id="vision" checked> Bild senden</label>
      <label class="chk"><input type="checkbox" id="useGpu" checked> WebGPU</label>
    </div>
    <div class="progress" id="modelProgress" hidden>
      <div class="progress-track"><div class="progress-bar" id="modelProgressBar"></div></div>
      <span class="progress-text" id="modelProgressText"></span>
    </div>
    <p class="hint" id="modelStatus">Standard: gemma-4-E4B-it-web.task (~3 GB). Wird einmalig heruntergeladen, im Gerät gespeichert und läuft komplett im Browser.</p>
    <button class="link" id="clearModel" style="margin-top:12px" hidden>Modell-Cache löschen</button>

    <div class="settings-actions">
      <button class="btn" id="share">Link teilen</button>
      <button class="btn" id="exportCsv">CSV exportieren</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
(function () {
  const BOOK_KEY = "haushaltsgame.budget.v1";
  const MODEL_KEY = "haushaltsgame.budget.model";
  const CACHE_FLAG_PREFIX = "haushaltsgame.budget.modelcache.";
  const DEFAULT_MODEL = "https://huggingface.co/litert-community/gemma-4-E4B-it-litert-lm/resolve/main/gemma-4-E4B-it-web.task";
  const GENAI_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.29";
  const TOKEN_RE = /^[A-Za-z0-9_-]{6,40}$/;

  const $ = function (id) { return document.getElementById(id); };
  const el = function (tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const uid = function () { return Math.random().toString(36).slice(2, 9); };

  let token = null;
  let serverMode = /^https?:$/.test(location.protocol) && !/(^|\.)github\.io$/.test(location.hostname);
  let book = null;
  let knownRev = 0;
  let pendingSave = false;
  let saveTimer = null;
  let pollTimer = null;

  let llm = null;
  let selectedImage = null;

  function parseToken() {
    const segs = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").split("/").filter(Boolean);
    const last = (segs[segs.length - 1] || "").replace(/\.html$/, "");
    if (last !== "budget") return undefined;
    if (segs.length >= 2 && TOKEN_RE.test(segs[0])) return segs[0];
    return null;
  }

  function emptyBook() { return { receipts: [] }; }

  function normalizeBook(b) {
    if (!b || typeof b !== "object" || !Array.isArray(b.receipts)) return emptyBook();
    b.receipts.forEach(function (r) {
      if (!Array.isArray(r.items)) r.items = [];
      r.total = parseMoney(r.total);
      if (!r.total) r.total = r.items.reduce(function (s, it) { return s + (Number(it.price) || 0); }, 0);
    });
    return b;
  }

  function loadLocal() {
    try {
      return normalizeBook(JSON.parse(localStorage.getItem(BOOK_KEY)));
    } catch (e) {
      return emptyBook();
    }
  }

  function save() {
    if (serverMode && token) {
      pendingSave = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(putRemote, 400);
    } else {
      try { localStorage.setItem(BOOK_KEY, JSON.stringify(book)); } catch (e) {}
    }
  }

  function putRemote() {
    fetch("/api/budget/" + encodeURIComponent(token), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(book)
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && typeof j.rev === "number") knownRev = j.rev; pendingSave = false; })
      .catch(function () { pendingSave = false; });
  }

  function pullRemote() {
    if (!serverMode || !token || pendingSave) return;
    fetch("/api/budget/" + encodeURIComponent(token)).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (data) {
      if (data && typeof data.rev === "number" && data.rev !== knownRev) {
        knownRev = data.rev;
        book = normalizeBook(data.book);
        renderBook();
      }
    }).catch(function () {});
  }

  async function boot() {
    const savedUrl = localStorage.getItem(MODEL_KEY) || DEFAULT_MODEL;
    $("modelUrl").value = savedUrl;
    if (localStorage.getItem(CACHE_FLAG_PREFIX + modelKey(savedUrl))) showClearModel(true);
    token = parseToken();
    $("back").href = token ? "/" + token : "/";

    if (serverMode) {
      if (token === null) {
        try {
          const r = await fetch("/api/new", { method: "POST" });
          if (r.ok) { const j = await r.json(); location.replace("/" + j.token + "/budget"); return; }
        } catch (e) {}
      } else if (typeof token === "string") {
        try {
          const r = await fetch("/api/budget/" + encodeURIComponent(token));
          if (r.ok) {
            const data = await r.json();
            knownRev = data.rev || 0;
            book = normalizeBook(data.book);
            renderBook();
            pollTimer = setInterval(pullRemote, 12000);
            return;
          }
        } catch (e) {}
      }
    }
    book = loadLocal();
    renderBook();
  }

  function openSheet(id) { $(id).classList.add("show"); }
  function closeSheet(id) { $(id).classList.remove("show"); }

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove("show"); }, 1900);
  }

  function parseMoney(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    if (typeof v !== "string") return 0;
    let s = v.trim().replace(/[^0-9.,\-]/g, "");
    if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (s.indexOf(",") > -1) {
      s = s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  function fmt(n, cur) {
    try { return new Intl.NumberFormat("de-DE", { style: "currency", currency: cur || "EUR" }).format(Number(n) || 0); }
    catch (e) { return (Number(n) || 0).toFixed(2) + " " + (cur || ""); }
  }

  function fmtDate(v) {
    if (typeof v !== "string" || !v) return "";
    const m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + "." + m[2] + "." + m[1] : v;
  }

  function normalizeDate(v) {
    if (typeof v !== "string") return "";
    const s = v.trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + "-" + m[2] + "-" + m[3];
    m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if (m) return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
    return s;
  }

  function humanBytes(n) {
    if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
    if (n >= 1048576) return Math.round(n / 1048576) + " MB";
    if (n >= 1024) return Math.round(n / 1024) + " KB";
    return n + " B";
  }

  function humanTime(sec) {
    if (!isFinite(sec) || sec <= 0) return "";
    sec = Math.round(sec);
    const m = Math.floor(sec / 60), s = sec % 60;
    return (m > 0 ? m + " min " : "") + s + " s";
  }

  function pick(obj, keys) {
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return undefined;
  }

  function extractJson(text) {
    if (!text) return null;
    const src = text.replace(/```[a-zA-Z]*/g, "```");
    const start = src.indexOf("{");
    if (start < 0) return null;
    let depth = 0, inStr = false, esc = false, end = -1;
    for (let i = start; i < src.length; i++) {
      const c = src[i];
      if (inStr) {
        if (esc) esc = false;
        else if (c === "\\") esc = true;
        else if (c === '"') inStr = false;
      } else if (c === '"') inStr = true;
      else if (c === "{") depth++;
      else if (c === "}") { depth--; if (depth === 0) { end = i; break; } }
    }
    let json = src.slice(start, end < 0 ? src.length : end + 1);
    try { return JSON.parse(json); } catch (e) {}
    const repaired = json
      .replace(/,\s*([}\]])/g, "$1")
      .replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g, '$1"$2":')
      .replace(/'/g, '"');
    try { return JSON.parse(repaired); } catch (e) {}
    return null;
  }

  function normalizeReceipt(obj) {
    if (!obj || typeof obj !== "object") return null;
    const rawItems = pick(obj, ["items", "positionen", "line_items", "lineItems", "artikel", "posten", "products", "lines"]);
    const items = [];
    if (Array.isArray(rawItems)) {
      rawItems.forEach(function (it) {
        if (typeof it === "string") { items.push({ id: uid(), name: it, qty: 1, price: 0 }); return; }
        if (!it || typeof it !== "object") return;
        const qty = parseMoney(pick(it, ["qty", "quantity", "menge", "count", "anzahl"])) || 1;
        let price = parseMoney(pick(it, ["price", "total", "summe", "betrag", "amount", "gesamt"]));
        if (!price) {
          const unit = parseMoney(pick(it, ["unitPrice", "unit_price", "einzelpreis", "pricePerUnit", "preis"]));
          price = unit * qty;
        }
        const name = pick(it, ["name", "artikel", "item", "description", "bezeichnung", "produkt", "text"]);
        items.push({ id: uid(), name: String(name || "Artikel"), qty: qty, price: price });
      });
    }
    const merchant = String(pick(obj, ["merchant", "store", "shop", "vendor", "laden", "geschaeft", "geschäft", "haendler", "händler", "name"]) || "");
    const total = parseMoney(pick(obj, ["total", "summe", "gesamt", "gesamtbetrag", "amount", "betrag"]));
    return {
      id: uid(),
      merchant: merchant,
      date: normalizeDate(pick(obj, ["date", "datum", "kaufdatum"]) || ""),
      currency: String(pick(obj, ["currency", "waehrung", "währung", "curr"]) || "EUR").toUpperCase().slice(0, 4),
      total: total || items.reduce(function (s, it) { return s + it.price; }, 0),
      createdAt: Date.now(),
      items: items
    };
  }

  function buildPrompt() {
    return "Du bist ein Kassenzettel-Scanner. Lies den Kassenbon und antworte AUSSCHLIESSLICH mit " +
      "einem JSON-Objekt, ohne Erklaerung und ohne Markdown-Codeblock. Format:\n" +
      '{"merchant":"Ladenname","date":"YYYY-MM-DD","currency":"EUR","total":12.34,' +
      '"items":[{"name":"Artikel","qty":1,"price":1.23}]}\n' +
      "Regeln: price ist der Gesamtpreis der Position. Sind Einzelpreis und Menge gegeben, " +
      "multipliziere sie. Fehlt total, summiere die Positionen. Gib alle Positionen aus.";
  }

  function setStatus(msg, cls) {
    const n = $("modelStatus");
    n.textContent = msg;
    n.className = "hint" + (cls ? " " + cls : "");
  }

  function setProgress(frac, text) {
    const wrap = $("modelProgress");
    const bar = $("modelProgressBar");
    const label = $("modelProgressText");
    wrap.hidden = false;
    label.textContent = text || "";
    if (frac == null) {
      wrap.classList.add("indeterminate");
      bar.style.width = "40%";
    } else {
      wrap.classList.remove("indeterminate");
      bar.style.width = Math.max(0, Math.min(100, frac * 100)).toFixed(1) + "%";
    }
  }

  function hideProgress() {
    $("modelProgress").hidden = true;
  }

  function opfsSupported() {
    return !!(navigator.storage && navigator.storage.getDirectory);
  }

  function modelKey(url) {
    let h = 5381;
    for (let i = 0; i < url.length; i++) h = ((h << 5) + h + url.charCodeAt(i)) >>> 0;
    const tail = url.split("/").pop().replace(/[^A-Za-z0-9._-]/g, "_").slice(0, 60);
    return h.toString(36) + "-" + tail;
  }

  function progressReport(received, total, eta, cached) {
    const pct = total ? Math.min(1, received / total) : null;
    let text;
    if (cached) {
      text = "Aus Gerätespeicher (" + humanBytes(received) + ")";
    } else if (total) {
      text = Math.round(pct * 100) + " % · " + humanBytes(received) + " / " + humanBytes(total);
      if (eta) text += " · noch ca. " + humanTime(eta);
    } else {
      text = humanBytes(received);
    }
    setProgress(cached ? 1 : pct, text);
  }

  function progressReader(res, onProgress) {
    const total = Number(res.headers.get("Content-Length")) || 0;
    const reader = res.body.getReader();
    let received = 0;
    const start = performance.now();
    return new ReadableStream({
      async pull(controller) {
        try {
          const step = await reader.read();
          if (step.done) { controller.close(); return; }
          received += step.value.length;
          const elapsed = (performance.now() - start) / 1000;
          const speed = elapsed > 0 ? received / elapsed : 0;
          const eta = speed > 0 && total ? (total - received) / speed : 0;
          onProgress(received, total, eta, false);
          controller.enqueue(step.value);
        } catch (e) {
          controller.error(e);
        }
      },
      cancel(reason) { reader.cancel(reason); }
    });
  }

  async function ensureDownloaded(url, handle, onProgress) {
    const flagKey = CACHE_FLAG_PREFIX + modelKey(url);
    let existing = 0;
    try { existing = (await handle.getFile()).size; } catch (e) { existing = 0; }
    const doneSize = Number(localStorage.getItem(flagKey)) || 0;
    if (doneSize && existing === doneSize) {
      onProgress(existing, existing, 0, true);
      return;
    }

    let res = null;
    if (existing > 0) {
      res = await fetch(url, { headers: { Range: "bytes=" + existing + "-" } });
      if (res.status === 416) {
        localStorage.setItem(flagKey, String(existing));
        onProgress(existing, existing, 0, true);
        return;
      }
      if (res.status !== 206) {
        if (res.body) { try { res.body.cancel(); } catch (e) {} }
        existing = 0;
        res = null;
      }
    }
    if (!res) res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);

    const remaining = Number(res.headers.get("Content-Length")) || 0;
    const total = existing + remaining;
    const writable = await handle.createWritable(existing > 0 ? { keepExistingData: true } : undefined);
    const reader = res.body.getReader();
    let received = existing;
    const start = performance.now();
    try {
      for (;;) {
        const step = await reader.read();
        if (step.done) break;
        await writable.write({ type: "write", position: received, data: step.value });
        received += step.value.length;
        const elapsed = (performance.now() - start) / 1000;
        const speed = elapsed > 0 ? (received - existing) / elapsed : 0;
        const eta = speed > 0 && total ? (total - received) / speed : 0;
        onProgress(received, total, eta, false);
      }
    } finally {
      await writable.close();
    }
    if (total && received < total) {
      throw new Error("Download unvollständig (" + humanBytes(received) + " / " + humanBytes(total) + ")");
    }
    localStorage.setItem(flagKey, String(received));
    onProgress(received, total || received, 0, true);
  }

  async function modelReader(url) {
    if (opfsSupported()) {
      let handle = null;
      try {
        if (navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) {} }
        const root = await navigator.storage.getDirectory();
        const dir = await root.getDirectoryHandle("models", { create: true });
        handle = await dir.getFileHandle(modelKey(url), { create: true });
      } catch (e) {
        handle = null;
      }
      if (handle) {
        await ensureDownloaded(url, handle, progressReport);
        const file = await handle.getFile();
        if (!file.size) throw new Error("Leere Datei");
        showClearModel(true);
        return file.stream().getReader();
      }
      showToast("Lade ohne Fortsetzen…");
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    if (!res.body || !res.body.getReader) {
      const buf = new Uint8Array(await res.arrayBuffer());
      progressReport(buf.length, buf.length, 0, true);
      return new Blob([buf]).stream().getReader();
    }
    return progressReader(res, progressReport).getReader();
  }

  function showClearModel(show) {
    const btn = $("clearModel");
    if (btn) btn.hidden = !show;
  }

  async function clearModelCache() {
    try {
      const root = await navigator.storage.getDirectory();
      const dir = await root.getDirectoryHandle("models", { create: true });
      const names = [];
      for await (const name of dir.keys()) names.push(name);
      for (const name of names) await dir.removeEntry(name);
    } catch (e) {}
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf(CACHE_FLAG_PREFIX) === 0) localStorage.removeItem(k);
    });
    showClearModel(false);
    showToast("Modell-Cache gelöscht");
  }

  function updateModelNotice() {
    const notice = $("modelNotice");
    if (notice) notice.hidden = !!llm;
  }

  async function loadModel() {
    const url = $("modelUrl").value.trim();
    const localFile = $("modelFile").files && $("modelFile").files[0];
    const useGpu = $("useGpu").checked;
    const vision = $("vision").checked;
    if (!url && !localFile) { setStatus("Bitte Modell-URL angeben oder Datei wählen.", "error"); return; }

    if (useGpu && !navigator.gpu) {
      setStatus("WebGPU ist auf diesem Gerät nicht verfügbar. iOS benötigt mindestens iOS 18 / Safari 18. Alternativ „WebGPU“ deaktivieren.", "error");
      return;
    }

    $("loadModel").disabled = true;
    try {
      setStatus("Lade MediaPipe Runtime…", "");
      setProgress(null, "MediaPipe wird geladen…");
      const mod = await import(GENAI_CDN + "/genai_bundle.mjs");
      const fileset = await mod.FilesetResolver.forGenAiTasks(GENAI_CDN + "/wasm");

      const baseOptions = { delegate: useGpu ? "GPU" : "CPU" };
      if (localFile) {
        setStatus("Lade lokale Modelldatei…", "");
        setProgress(null, humanBytes(localFile.size) + " (lokal)");
        baseOptions.modelAssetBuffer = localFile.stream().getReader();
      } else {
        setProgress(0, "0 %");
        baseOptions.modelAssetBuffer = await modelReader(url);
        setProgress(1, "Heruntergeladen · wird initialisiert…");
      }
      setStatus("Initialisiere Modell…", "");

      const options = {
        baseOptions: baseOptions,
        maxTokens: 2048,
        topK: 1,
        temperature: 0,
        randomSeed: 0
      };
      if (vision) options.maxNumImages = 1;

      llm = await mod.LlmInference.createFromOptions(fileset, options);
      if (!localFile) localStorage.setItem(MODEL_KEY, url);
      setStatus("Modell bereit ✓ " + (localFile ? localFile.name : url.split("/").pop()), "ok");
      setProgress(1, "Modell bereit ✓");
      updateModelNotice();
      updateScanButton();
      showToast("Modell geladen");
    } catch (e) {
      setStatus("Modell konnte nicht geladen werden: " + (e && e.message ? e.message : e), "error");
      hideProgress();
    }
    $("loadModel").disabled = false;
  }

  async function handleImage(file) {
    if (!file) return;
    try {
      const bitmap = await createImageBitmap(file);
      const max = 1280;
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      selectedImage = canvas;
      const preview = $("preview");
      preview.width = canvas.width;
      preview.height = canvas.height;
      preview.getContext("2d").drawImage(canvas, 0, 0);
      preview.hidden = false;
      $("dropInner").hidden = true;
      updateScanButton();
    } catch (e) {
      showToast("Bild konnte nicht geladen werden");
    }
  }

  function updateScanButton() {
    const hasInput = !!selectedImage || !!$("ocrText").value.trim();
    $("scan").disabled = !(llm && hasInput);
  }

  async function scan() {
    if (!llm) return;
    const vision = $("vision").checked;
    const parts = [];
    if (vision && selectedImage) parts.push({ imageSource: selectedImage });
    const text = $("ocrText").value.trim();
    if (text) parts.push("Kassenbon-Text:\n" + text);
    parts.push(buildPrompt());

    const status = $("scanStatus");
    status.hidden = false;
    status.textContent = "Scanne…";
    $("scan").disabled = true;
    $("scan").textContent = "Scanne…";

    try {
      const result = await llm.generateResponse(parts, function () {
        status.textContent = "Scanne…";
      });
      const parsed = normalizeReceipt(extractJson(result));
      status.hidden = true;
      if (!parsed || (!parsed.items.length && !parsed.total && !parsed.merchant)) {
        showToast("Keine Einträge erkannt");
      } else {
        $("scanInput").hidden = true;
        $("scanTitle").textContent = "Beleg prüfen";
        renderReview(parsed);
      }
    } catch (e) {
      showToast("Fehler beim Scannen");
      status.textContent = String(e && e.message ? e.message : e);
    }
    $("scan").disabled = false;
    $("scan").textContent = "Scannen";
    updateScanButton();
  }

  function field(label, id, value, type) {
    const wrap = el("div", "field");
    wrap.appendChild(el("label", null, label));
    const input = el("input");
    input.id = id;
    input.type = type || "text";
    input.value = value === undefined || value === null ? "" : value;
    wrap.appendChild(input);
    return wrap;
  }

  function itemRow(it) {
    const row = el("div", "item-edit");
    const name = el("input", "it-name");
    name.type = "text";
    name.placeholder = "Artikel";
    name.value = it.name || "";
    const qty = el("input", "it-qty");
    qty.type = "number";
    qty.inputMode = "decimal";
    qty.min = "0";
    qty.step = "any";
    qty.placeholder = "Menge";
    qty.value = it.qty || 1;
    const price = el("input", "it-price");
    price.type = "number";
    price.inputMode = "decimal";
    price.step = "0.01";
    price.placeholder = "Preis";
    price.value = Number(it.price || 0).toFixed(2);
    const rm = el("button", "btn ghost", "×");
    rm.type = "button";
    rm.title = "Position entfernen";
    rm.addEventListener("click", function () { row.remove(); });
    row.appendChild(name);
    row.appendChild(qty);
    row.appendChild(price);
    row.appendChild(rm);
    return row;
  }

  function renderReview(r) {
    const box = $("review");
    box.hidden = false;
    box.innerHTML = "";

    const total = el("div", "field");
    total.appendChild(el("label", null, "Betrag"));
    const totalInput = el("input");
    totalInput.id = "f_total";
    totalInput.type = "number";
    totalInput.inputMode = "decimal";
    totalInput.step = "0.01";
    totalInput.value = Number(r.total || 0).toFixed(2);
    total.appendChild(totalInput);
    box.appendChild(total);

    const grid = el("div", "review-grid");
    grid.appendChild(field("Laden", "f_merchant", r.merchant));
    grid.appendChild(field("Datum", "f_date", r.date, "date"));
    box.appendChild(grid);

    const items = el("div", "items-edit");
    r.items.forEach(function (it) { items.appendChild(itemRow(it)); });
    box.appendChild(items);

    const add = el("button", "btn block ghost-add", "+ Position");
    add.type = "button";
    add.addEventListener("click", function () { items.appendChild(itemRow({ name: "", qty: 1, price: 0 })); });
    box.appendChild(add);

    const actions = el("div", "review-actions");
    const cancel = el("button", "btn", "Abbrechen");
    cancel.type = "button";
    cancel.addEventListener("click", closeScanSheet);
    const commit = el("button", "btn primary", "Speichern");
    commit.type = "button";
    commit.addEventListener("click", commitReview);
    actions.appendChild(cancel);
    actions.appendChild(commit);
    box.appendChild(actions);
  }

  function readReview() {
    const items = Array.prototype.slice.call($("review").querySelectorAll(".item-edit")).map(function (row) {
      return {
        id: uid(),
        name: row.querySelector(".it-name").value.trim() || "Artikel",
        qty: parseMoney(row.querySelector(".it-qty").value) || 1,
        price: parseMoney(row.querySelector(".it-price").value)
      };
    }).filter(function (it) { return it.name || it.price; });
    return {
      id: uid(),
      merchant: $("f_merchant").value.trim(),
      date: $("f_date").value,
      currency: "EUR",
      total: parseMoney($("f_total").value) || items.reduce(function (s, it) { return s + it.price; }, 0),
      createdAt: Date.now(),
      items: items
    };
  }

  function commitReview() {
    const r = readReview();
    if (!r.items.length && !r.total) { showToast("Keine Positionen"); return; }
    book.receipts.push(r);
    save();
    renderBook();
    closeScanSheet();
    showToast("Eintrag gespeichert ✓");
  }

  function deleteReceipt(id) {
    book.receipts = book.receipts.filter(function (r) { return r.id !== id; });
    save();
    renderBook();
  }

  function renderBook() {
    const box = $("book");
    box.innerHTML = "";
    const receipts = book.receipts.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    let grand = 0;

    receipts.forEach(function (r) {
      grand += Number(r.total) || 0;
      const card = el("div", "entry");

      const head = el("div", "entry-head");
      const main = el("div", "entry-main");
      main.appendChild(el("div", "entry-merchant", r.merchant || "Unbekannter Laden"));
      const n = r.items.length;
      const metaParts = [];
      if (r.date) metaParts.push(fmtDate(r.date));
      if (n) metaParts.push(n + (n === 1 ? " Position" : " Positionen"));
      main.appendChild(el("div", "entry-meta", metaParts.join(" · ") || "Kein Datum"));
      head.appendChild(main);
      head.appendChild(el("div", "entry-amount", fmt(r.total, r.currency)));
      card.appendChild(head);

      const items = el("div", "entry-items");
      r.items.forEach(function (it) {
        const row = el("div", "entry-item");
        const nm = el("span");
        nm.appendChild(el("span", null, (it.qty || 1) + "× "));
        nm.appendChild(document.createTextNode(it.name || "Artikel"));
        row.appendChild(nm);
        row.appendChild(el("span", "price", fmt(it.price, r.currency)));
        items.appendChild(row);
      });
      const del = el("button", "entry-del", "Löschen");
      del.addEventListener("click", function (e) { e.stopPropagation(); deleteReceipt(r.id); });
      items.appendChild(del);
      card.appendChild(items);

      if (r.items.length) {
        head.addEventListener("click", function () { card.classList.toggle("open"); });
      }
      box.appendChild(card);
    });

    if (!receipts.length) box.appendChild(el("div", "empty", "Noch keine Einträge.\nTippe auf +, um einen Beleg zu scannen."));
    $("grandTotal").textContent = fmt(grand, "EUR");
    $("receiptCount").textContent = receipts.length
      ? receipts.length + (receipts.length === 1 ? " Beleg" : " Belege")
      : "Noch keine Belege";
  }

  function blankReceipt() {
    return { id: uid(), merchant: "", date: "", currency: "EUR", total: 0, createdAt: Date.now(), items: [] };
  }

  function openScanFlow() {
    $("scanInput").hidden = false;
    $("review").hidden = true;
    $("scanTitle").textContent = "Beleg scannen";
    updateModelNotice();
    updateScanButton();
    openSheet("scanSheet");
  }

  function manualAdd() {
    $("scanInput").hidden = true;
    $("scanTitle").textContent = "Eintrag";
    renderReview(blankReceipt());
    openSheet("scanSheet");
  }

  function closeScanSheet() {
    closeSheet("scanSheet");
    setTimeout(function () {
      $("scanInput").hidden = false;
      $("review").hidden = true;
      $("dropInner").hidden = false;
      $("preview").hidden = true;
      $("ocrText").value = "";
      $("file").value = "";
      selectedImage = null;
      $("scanStatus").hidden = true;
      updateScanButton();
    }, 260);
  }

  function exportCsv() {
    const rows = [["Laden", "Datum", "Artikel", "Menge", "Preis", "Waehrung", "Belegsumme"]];
    book.receipts.forEach(function (r) {
      if (!r.items.length) {
        rows.push([r.merchant, r.date, "", "", "", r.currency, r.total]);
      } else {
        r.items.forEach(function (it) {
          rows.push([r.merchant, r.date, it.name, it.qty, it.price, r.currency, r.total]);
        });
      }
    });
    const csv = rows.map(function (row) {
      return row.map(function (c) {
        const s = String(c === undefined || c === null ? "" : c);
        return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(";");
    }).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "haushaltsbuch.csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function share() {
    const url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast("Link kopiert ✓"); }, function () { prompt("Link kopieren:", url); });
    } else {
      prompt("Link kopieren:", url);
    }
  }

  $("add").addEventListener("click", function () { openSheet("actionSheet"); });
  $("scanAction").addEventListener("click", function () {
    closeSheet("actionSheet");
    setTimeout(openScanFlow, 180);
  });
  $("manualAction").addEventListener("click", function () {
    closeSheet("actionSheet");
    setTimeout(manualAdd, 180);
  });
  $("settings").addEventListener("click", function () { openSheet("settingsSheet"); });
  $("openSettings").addEventListener("click", function () {
    closeSheet("scanSheet");
    setTimeout(function () { openSheet("settingsSheet"); }, 180);
  });
  $("scanClose").addEventListener("click", closeScanSheet);
  $("settingsClose").addEventListener("click", function () { closeSheet("settingsSheet"); });

  ["actionSheet", "scanSheet", "settingsSheet"].forEach(function (id) {
    const b = $(id);
    b.addEventListener("click", function (e) { if (e.target === b) closeSheet(id); });
  });

  $("loadModel").addEventListener("click", loadModel);
  $("clearModel").addEventListener("click", clearModelCache);
  $("scan").addEventListener("click", scan);
  $("share").addEventListener("click", share);
  $("exportCsv").addEventListener("click", exportCsv);
  $("ocrText").addEventListener("input", updateScanButton);
  $("file").addEventListener("change", function () { handleImage($("file").files && $("file").files[0]); });

  const drop = $("drop");
  drop.addEventListener("click", function () { $("file").click(); });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleImage(f);
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) pullRemote();
  });

  window.addEventListener("pagehide", function () { if (pendingSave) putRemote(); });

  boot();
})();
</script>
