<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Haushaltsbuch</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --line: #e8eaee;
    --text: #111827;
    --muted: #8b93a1;
    --accent: #3b82f6;
    --accent-dark: #2563eb;
  }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 12px;
    background: rgba(244,245,247,.86);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .brand { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    font-size: 1.05rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    transition: transform .12s, background .12s;
  }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.ghost { border-color: transparent; background: transparent; font-size: 1rem; color: var(--muted); }
  .icon-btn:disabled { opacity: .5; pointer-events: none; }

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 4px 16px calc(120px + env(safe-area-inset-bottom));
  }

  .hero { padding: 12px 4px 22px; }
  .hero-label { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .hero-total {
    display: block;
    font-size: clamp(2.2rem, 11vw, 2.9rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    line-height: 1.05;
  }
  .hero-sub { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }

  .tabs {
    display: flex;
    gap: 4px;
    background: #e8eaee;
    border-radius: 12px;
    padding: 4px;
    margin: 0 0 14px;
  }
  .tab {
    flex: 1;
    border: 0;
    background: transparent;
    font: inherit;
    font-size: .85rem;
    font-weight: 700;
    color: var(--muted);
    padding: 9px 6px;
    border-radius: 9px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .tab.active {
    background: var(--card);
    color: var(--text);
    box-shadow: 0 1px 3px rgba(17,24,39,.1);
  }

  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow .15s;
  }
  .entry-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
  }
  .entry-main { flex: 1; min-width: 0; }
  .entry-merchant { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .entry-amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .entry-items { display: none; padding: 4px 16px 0; border-top: 1px solid var(--line); }
  .entry.open .entry-items { display: block; }
  .entry-item { display: flex; justify-content: space-between; gap: 12px; font-size: .85rem; color: #4b5563; padding: 6px 0; }
  .entry-item .price { font-variant-numeric: tabular-nums; color: var(--muted); }
  .entry-item .cat { color: var(--muted); font-size: .78rem; }
  .entry-del {
    display: block;
    width: calc(100% + 32px);
    margin: 4px -16px 0;
    text-align: left;
    border: 0;
    border-top: 1px solid var(--line);
    background: transparent;
    color: #ef4444;
    font: inherit;
    font-weight: 600;
    font-size: .85rem;
    padding: 14px 16px;
    cursor: pointer;
  }
  .entry-del:active { background: #fef2f2; }

  .empty { text-align: center; color: var(--muted); font-size: .9rem; padding: 56px 24px; }

  .fab {
    position: fixed;
    right: max(20px, calc(50vw - 280px + 20px));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 0;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(59,130,246,.4);
    z-index: 30;
    transition: transform .12s, box-shadow .12s;
  }
  .fab:active { transform: scale(.9); }

  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(17,24,39,.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform .26s cubic-bezier(.2,.9,.3,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  .sheet-backdrop.show .sheet { transform: translateY(0); }
  .sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: #d1d5db; margin: 6px auto 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet-head h2 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }

  .sheet-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    background: #f8f9fb;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    cursor: pointer;
    text-align: left;
  }
  .sheet-item:active { transform: scale(.98); }
  .sheet-item .ico { font-size: 1.3rem; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label, .field-label { font-size: .74rem; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=url], input[type=number], input[type=date], input[type=file], textarea, select {
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    padding: 12px 13px;
    width: 100%;
  }
  input:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }
  textarea { resize: vertical; min-height: 80px; }

  .row-inline { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .row-inline .grow { flex: 1; min-width: 0; }
  .toggles { display: flex; gap: 16px; flex-wrap: wrap; margin: 4px 0 12px; }
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: #374151; font-weight: 600; }
  .chk input { width: 20px; height: 20px; }

  .btn {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    font-family: inherit;
    font-size: .9rem;
    font-weight: 700;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
    transition: transform .12s, background .12s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:active { background: var(--accent-dark); }
  .btn.block { display: block; width: 100%; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn.ghost-add { border-style: dashed; color: var(--muted); background: transparent; margin-bottom: 14px; }

  .hint { font-size: .78rem; color: var(--muted); line-height: 1.45; margin: 4px 0 0; }
  .hint.error { color: #b91c1c; }
  .hint.ok { color: #047857; }

  .progress { margin: 10px 0 0; }
  .progress-track { height: 8px; border-radius: 999px; background: #eef0f3; overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .2s; }
  .progress.indeterminate .progress-bar { animation: indet 1.1s ease-in-out infinite; }
  @keyframes indet {
    0% { margin-left: -35%; }
    100% { margin-left: 100%; }
  }
  .progress-text { display: block; font-size: .76rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .drop {
    position: relative;
    border: 1.5px dashed #cbd5e1;
    border-radius: 16px;
    background: #f9fafb;
    min-height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .drop:hover, .drop.over { border-color: #60a5fa; background: #eff6ff; }
  .drop-inner { text-align: center; color: var(--muted); font-size: .9rem; padding: 24px; }
  .drop-icon { font-size: 2rem; margin-bottom: 8px; }
  #preview { display: block; max-width: 100%; height: auto; }

  .more { margin-bottom: 12px; }
  .more summary { font-size: .82rem; color: var(--muted); font-weight: 600; cursor: pointer; padding: 4px 0; }
  .more textarea { margin-top: 8px; }

  .notice {
    font-size: .82rem;
    color: #92400e;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; padding: 0; text-decoration: underline; }

  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .items-edit { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .item-edit { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .item-edit .it-name, .item-edit .it-cat { flex: 1 1 100%; }
  .item-edit .it-qty { flex: 0 0 64px; }
  .item-edit .it-price { flex: 1 1 90px; }
  .item-edit .btn.ghost { flex: 0 0 36px; padding: 8px; font-size: 1rem; color: var(--muted); border: 0; background: transparent; }
  .review-actions { display: flex; gap: 10px; margin-top: 6px; }
  .review-actions .btn { flex: 1; }

  .scan-status { font-size: .85rem; color: var(--muted); padding: 12px 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    background: #111827;
    color: #fff;
    font-size: .85rem;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 60;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .settings-actions { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }

  .scan-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(17,24,39,.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: #fff;
    font-size: .9rem;
    font-weight: 600;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  .scan-overlay[hidden] { display: none; }
  .spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 420px) {
    .review-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="icon-btn" id="back" href="/" aria-label="Zurück">←</a>
  <span class="brand">Haushaltsbuch</span>
  <button class="icon-btn" id="settings" aria-label="Einstellungen">⚙︎</button>
</header>

<main>
  <section class="hero">
    <span class="hero-label">Ausgaben gesamt</span>
    <span class="hero-total" id="grandTotal">0,00 €</span>
    <span class="hero-sub" id="receiptCount">Noch keine Belege</span>
  </section>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="receipts">Belege</button>
    <button class="tab" data-view="categories">Kategorien</button>
    <button class="tab" data-view="shops">Läden</button>
  </nav>
  <section id="book"></section>
</main>

<button class="fab" id="add" aria-label="Beleg fotografieren"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2a1 1 0 0 0 .83-.45l.94-1.41A1 1 0 0 1 10.3 3.68h3.4a1 1 0 0 1 .83.46l.94 1.41A1 1 0 0 0 16.3 6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.3" r="3.2" stroke="currentColor" stroke-width="1.8"/></svg></button>

<input id="file" type="file" accept="image/*" capture="environment" hidden>

<div class="scan-overlay" id="scanOverlay" hidden>
  <div class="spinner"></div>
  <span>Beleg wird gescannt…</span>
</div>

<div class="sheet-backdrop" id="settingsSheet">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2>Einstellungen</h2>
      <button class="icon-btn ghost" id="settingsClose" aria-label="Schließen">✕</button>
    </div>

    <div class="settings-actions">
      <button class="btn" id="share">Link teilen</button>
      <button class="btn" id="exportCsv">CSV exportieren</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
(function () {
  const BOOK_KEY = "haushaltsgame.budget.v1";
  const TOKEN_RE = /^[A-Za-z0-9_-]{6,40}$/;
  const CATEGORIES = [
    "Lebensmittel", "Obst & Gemüse", "Backwaren", "Fleisch & Wurst",
    "Milchprodukte", "Getränke", "Tiefkühl", "Snacks & Süßes",
    "Drogerie & Hygiene", "Haushalt & Reinigung", "Tierbedarf", "Sonstiges"
  ];
  function normalizeCategory(v) {
    const s = String(v || "").trim().toLowerCase();
    for (let i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].toLowerCase() === s) return CATEGORIES[i];
    }
    return "Sonstiges";
  }

  const $ = function (id) { return document.getElementById(id); };
  const el = function (tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  };
  const uid = function () { return Math.random().toString(36).slice(2, 9); };

  let token = null;
  let serverMode = /^https?:$/.test(location.protocol) && !/(^|\.)github\.io$/.test(location.hostname);
  let book = null;
  let knownRev = 0;
  let pendingSave = false;
  let saveTimer = null;
  let pollTimer = null;
  let currentView = "receipts";

  function parseToken() {
    const segs = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, "").split("/").filter(Boolean);
    const last = (segs[segs.length - 1] || "").replace(/\.html$/, "");
    if (last !== "budget") return undefined;
    if (segs.length >= 2 && TOKEN_RE.test(segs[0])) return segs[0];
    return null;
  }

  function emptyBook() { return { receipts: [] }; }

  function normalizeBook(b) {
    if (!b || typeof b !== "object" || !Array.isArray(b.receipts)) return emptyBook();
    b.receipts.forEach(function (r) {
      if (!Array.isArray(r.items)) r.items = [];
      r.items.forEach(function (it) { it.category = normalizeCategory(it.category); });
      r.total = parseMoney(r.total);
      if (!r.total) r.total = r.items.reduce(function (s, it) { return s + (Number(it.price) || 0); }, 0);
    });
    return b;
  }

  function loadLocal() {
    try {
      return normalizeBook(JSON.parse(localStorage.getItem(BOOK_KEY)));
    } catch (e) {
      return emptyBook();
    }
  }

  function save() {
    if (serverMode && token) {
      pendingSave = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(putRemote, 400);
    } else {
      try { localStorage.setItem(BOOK_KEY, JSON.stringify(book)); } catch (e) {}
    }
  }

  function putRemote() {
    fetch("/api/budget/" + encodeURIComponent(token), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(book)
    }).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && typeof j.rev === "number") knownRev = j.rev; pendingSave = false; })
      .catch(function () { pendingSave = false; });
  }

  function pullRemote() {
    if (!serverMode || !token || pendingSave) return;
    fetch("/api/budget/" + encodeURIComponent(token)).then(function (r) {
      return r.ok ? r.json() : null;
    }).then(function (data) {
      if (data && typeof data.rev === "number" && data.rev !== knownRev) {
        knownRev = data.rev;
        book = normalizeBook(data.book);
        renderBook();
      }
    }).catch(function () {});
  }

  async function boot() {
    token = parseToken();
    $("back").href = token ? "/" + token : "/";

    if (serverMode) {
      if (token === null) {
        try {
          const r = await fetch("/api/new", { method: "POST" });
          if (r.ok) { const j = await r.json(); location.replace("/" + j.token + "/budget"); return; }
        } catch (e) {}
      } else if (typeof token === "string") {
        try {
          const r = await fetch("/api/budget/" + encodeURIComponent(token));
          if (r.ok) {
            const data = await r.json();
            knownRev = data.rev || 0;
            book = normalizeBook(data.book);
            renderBook();
            pollTimer = setInterval(pullRemote, 12000);
            return;
          }
        } catch (e) {}
      }
    }
    book = loadLocal();
    renderBook();
  }

  function openSheet(id) { $(id).classList.add("show"); }
  function closeSheet(id) { $(id).classList.remove("show"); }

  function showToast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { t.classList.remove("show"); }, 1900);
  }

  function parseMoney(v) {
    if (typeof v === "number") return isFinite(v) ? v : 0;
    if (typeof v !== "string") return 0;
    let s = v.trim().replace(/[^0-9.,\-]/g, "");
    if (s.indexOf(",") > -1 && s.indexOf(".") > -1) {
      if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (s.indexOf(",") > -1) {
      s = s.replace(",", ".");
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  function fmt(n, cur) {
    try { return new Intl.NumberFormat("de-DE", { style: "currency", currency: cur || "EUR" }).format(Number(n) || 0); }
    catch (e) { return (Number(n) || 0).toFixed(2) + " " + (cur || ""); }
  }

  function fmtDate(v) {
    if (typeof v !== "string" || !v) return "";
    const m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[3] + "." + m[2] + "." + m[1] : v;
  }

  function normalizeDate(v) {
    if (typeof v !== "string") return "";
    const s = v.trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + "-" + m[2] + "-" + m[3];
    m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
    if (m) return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
    return s;
  }

  function pick(obj, keys) {
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return undefined;
  }

  function normalizeReceipt(obj) {
    if (!obj || typeof obj !== "object") return null;
    const rawItems = pick(obj, ["items", "positionen", "line_items", "lineItems", "artikel", "posten", "products", "lines"]);
    const items = [];
    if (Array.isArray(rawItems)) {
      rawItems.forEach(function (it) {
        if (typeof it === "string") { items.push({ id: uid(), name: it, qty: 1, price: 0, category: "Sonstiges" }); return; }
        if (!it || typeof it !== "object") return;
        const qty = parseMoney(pick(it, ["qty", "quantity", "menge", "count", "anzahl"])) || 1;
        let price = parseMoney(pick(it, ["price", "total", "summe", "betrag", "amount", "gesamt"]));
        if (!price) {
          const unit = parseMoney(pick(it, ["unitPrice", "unit_price", "einzelpreis", "pricePerUnit", "preis"]));
          price = unit * qty;
        }
        const name = pick(it, ["name", "artikel", "item", "description", "bezeichnung", "produkt", "text"]);
        const category = normalizeCategory(pick(it, ["category", "kategorie", "cat", "warengruppe"]));
        items.push({ id: uid(), name: String(name || "Artikel"), qty: qty, price: price, category: category });
      });
    }
    const merchant = String(pick(obj, ["merchant", "store", "shop", "vendor", "laden", "geschaeft", "geschäft", "haendler", "händler", "name"]) || "");
    const total = parseMoney(pick(obj, ["total", "summe", "gesamt", "gesamtbetrag", "amount", "betrag"]));
    return {
      id: uid(),
      merchant: merchant,
      date: normalizeDate(pick(obj, ["date", "datum", "kaufdatum"]) || ""),
      currency: String(pick(obj, ["currency", "waehrung", "währung", "curr"]) || "EUR").toUpperCase().slice(0, 4),
      total: total || items.reduce(function (s, it) { return s + it.price; }, 0),
      createdAt: Date.now(),
      items: items
    };
  }

  async function scanOnServer(image, text) {
    const r = await fetch("/api/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, image: image || "", text: text || "" })
    });
    const j = await r.json().catch(function () { return null; });
    if (!r.ok) throw new Error((j && j.error) || ("HTTP " + r.status));
    if (!j || !j.receipt) throw new Error("Leere Antwort");
    return normalizeReceipt(j.receipt);
  }

  async function scanImageFile(file) {
    const overlay = $("scanOverlay");
    overlay.hidden = false;
    try {
      const bitmap = await createImageBitmap(file);
      const max = 1280;
      const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const image = canvas.toDataURL("image/jpeg", 0.85);
      const parsed = await scanOnServer(image, "");
      if (!parsed || (!parsed.items.length && !parsed.total && !parsed.merchant)) {
        showToast("Keine Einträge erkannt");
      } else {
        book.receipts.push(parsed);
        save();
        renderBook();
        const n = parsed.items.length;
        showToast("Beleg hinzugefügt" + (n ? " · " + n + (n === 1 ? " Position" : " Positionen") : ""));
      }
    } catch (e) {
      showToast("Fehler beim Scannen");
    } finally {
      overlay.hidden = true;
    }
  }

  function deleteReceipt(id) {
    book.receipts = book.receipts.filter(function (r) { return r.id !== id; });
    save();
    renderBook();
  }

  function renderBook() {
    const box = $("book");
    box.innerHTML = "";
    const receipts = book.receipts.slice().sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    let grand = 0;
    receipts.forEach(function (r) { grand += Number(r.total) || 0; });
    $("grandTotal").textContent = fmt(grand, "EUR");
    $("receiptCount").textContent = receipts.length
      ? receipts.length + (receipts.length === 1 ? " Beleg" : " Belege")
      : "Noch keine Belege";

    if (currentView === "categories") { renderCategories(box); return; }
    if (currentView === "shops") { renderShops(box); return; }
    renderReceipts(box, receipts);
  }

  function renderReceipts(box, receipts) {
    receipts.forEach(function (r) {
      const card = el("div", "entry");

      const head = el("div", "entry-head");
      const main = el("div", "entry-main");
      main.appendChild(el("div", "entry-merchant", r.merchant || "Unbekannter Laden"));
      const n = r.items.length;
      const metaParts = [];
      if (r.date) metaParts.push(fmtDate(r.date));
      if (n) metaParts.push(n + (n === 1 ? " Position" : " Positionen"));
      main.appendChild(el("div", "entry-meta", metaParts.join(" · ") || "Kein Datum"));
      head.appendChild(main);
      head.appendChild(el("div", "entry-amount", fmt(r.total, r.currency)));
      card.appendChild(head);

      const items = el("div", "entry-items");
      r.items.forEach(function (it) {
        const row = el("div", "entry-item");
        const nm = el("span");
        if ((it.qty || 1) > 1) nm.appendChild(el("span", null, it.qty + "× "));
        nm.appendChild(document.createTextNode(it.name || "Artikel"));
        if (it.category) nm.appendChild(el("span", "cat", " · " + it.category));
        row.appendChild(nm);
        row.appendChild(el("span", "price", fmt(it.price, r.currency)));
        items.appendChild(row);
      });
      const del = el("button", "entry-del", "Löschen");
      del.addEventListener("click", function (e) { e.stopPropagation(); deleteReceipt(r.id); });
      items.appendChild(del);
      card.appendChild(items);

      if (r.items.length) {
        head.addEventListener("click", function () { card.classList.toggle("open"); });
      }
      box.appendChild(card);
    });

    if (!receipts.length) box.appendChild(el("div", "empty", "Noch keine Einträge.\nTippe auf die Kamera unten rechts, um einen Beleg zu scannen."));
  }

  function groupCard(box, title, meta, total, lines) {
    const card = el("div", "entry");
    const head = el("div", "entry-head");
    const main = el("div", "entry-main");
    main.appendChild(el("div", "entry-merchant", title));
    main.appendChild(el("div", "entry-meta", meta));
    head.appendChild(main);
    head.appendChild(el("div", "entry-amount", fmt(total, "EUR")));
    card.appendChild(head);
    const items = el("div", "entry-items");
    lines.forEach(function (ln) {
      const row = el("div", "entry-item");
      const nm = el("span");
      if (ln.qty && ln.qty > 1) nm.appendChild(el("span", null, ln.qty + "× "));
      nm.appendChild(document.createTextNode(ln.name || "Artikel"));
      if (ln.sub) nm.appendChild(el("span", "cat", " · " + ln.sub));
      row.appendChild(nm);
      row.appendChild(el("span", "price", fmt(ln.price, "EUR")));
      items.appendChild(row);
    });
    card.appendChild(items);
    head.addEventListener("click", function () { card.classList.toggle("open"); });
    box.appendChild(card);
  }

  function renderCategories(box) {
    const map = {};
    book.receipts.forEach(function (r) {
      r.items.forEach(function (it) {
        const c = it.category || "Sonstiges";
        const g = map[c] || (map[c] = { total: 0, count: 0, lines: [] });
        const price = Number(it.price) || 0;
        g.total += price;
        g.count += 1;
        g.lines.push({ name: it.name, qty: it.qty || 1, price: price, sub: r.merchant || "" });
      });
    });
    const cats = Object.keys(map).sort(function (a, b) { return map[b].total - map[a].total; });
    if (!cats.length) { box.appendChild(el("div", "empty", "Noch keine Einträge.")); return; }
    cats.forEach(function (c) {
      const g = map[c];
      g.lines.sort(function (a, b) { return b.price - a.price; });
      groupCard(box, c, g.count + (g.count === 1 ? " Position" : " Positionen"), g.total, g.lines);
    });
  }

  function renderShops(box) {
    const map = {};
    book.receipts.forEach(function (r) {
      const s = r.merchant || "Unbekannter Laden";
      const g = map[s] || (map[s] = { total: 0, count: 0, lines: [] });
      g.total += Number(r.total) || 0;
      g.count += 1;
      g.lines.push({ name: fmtDate(r.date) || "Kein Datum", price: Number(r.total) || 0 });
    });
    const shops = Object.keys(map).sort(function (a, b) { return map[b].total - map[a].total; });
    if (!shops.length) { box.appendChild(el("div", "empty", "Noch keine Einträge.")); return; }
    shops.forEach(function (s) {
      const g = map[s];
      groupCard(box, s, g.count + (g.count === 1 ? " Beleg" : " Belege"), g.total, g.lines);
    });
  }

  function exportCsv() {
    const rows = [["Laden", "Datum", "Artikel", "Kategorie", "Menge", "Preis", "Waehrung", "Belegsumme"]];
    book.receipts.forEach(function (r) {
      if (!r.items.length) {
        rows.push([r.merchant, r.date, "", "", "", "", r.currency, r.total]);
      } else {
        r.items.forEach(function (it) {
          rows.push([r.merchant, r.date, it.name, it.category || "", it.qty, it.price, r.currency, r.total]);
        });
      }
    });
    const csv = rows.map(function (row) {
      return row.map(function (c) {
        const s = String(c === undefined || c === null ? "" : c);
        return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(";");
    }).join("\n");
    const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "haushaltsbuch.csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }

  function share() {
    const url = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast("Link kopiert ✓"); }, function () { prompt("Link kopieren:", url); });
    } else {
      prompt("Link kopieren:", url);
    }
  }

  $("add").addEventListener("click", function () { $("file").click(); });
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (btn) {
    btn.addEventListener("click", function () {
      currentView = btn.getAttribute("data-view");
      Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderBook();
    });
  });
  $("settings").addEventListener("click", function () { openSheet("settingsSheet"); });
  $("settingsClose").addEventListener("click", function () { closeSheet("settingsSheet"); });
  $("settingsSheet").addEventListener("click", function (e) { if (e.target === $("settingsSheet")) closeSheet("settingsSheet"); });

  $("share").addEventListener("click", share);
  $("exportCsv").addEventListener("click", exportCsv);
  $("file").addEventListener("change", function () {
    const f = $("file").files && $("file").files[0];
    $("file").value = "";
    if (f) scanImageFile(f);
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) pullRemote();
  });

  window.addEventListener("pagehide", function () { if (pendingSave) putRemote(); });

  boot();
})();
</script>
</body>
</html>
