<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haushaltsgame</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef1f6 0%, #f8f9fb 300px);
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 110px;
  }
  header {
    padding: 28px 20px 10px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 18px;
    letter-spacing: -0.02em;
  }
  h1 span { color: #9ca3af; font-weight: 500; }
  .totals {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .total-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 6px 16px 6px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  }
  .total-card .name { font-weight: 600; font-size: .9rem; }
  .total-card .score {
    font-weight: 800;
    font-size: 1rem;
    color: #fff;
    border-radius: 999px;
    min-width: 30px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 9px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: .85rem;
    flex: 0 0 auto;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    user-select: none;
  }
  .avatar.small { width: 34px; height: 34px; font-size: .78rem; }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .task {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(15,23,42,.05);
  }
  .task-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .task-head h2 {
    font-size: 1rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .task-head .sub {
    font-size: .75rem;
    color: #9ca3af;
    font-weight: 500;
    margin-left: 8px;
  }
  .del {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 8px;
  }
  .del:hover { color: #ef4444; background: #fef2f2; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
  }
  .row + .row { border-top: 1px dashed #f1f5f9; }
  .row .name {
    font-size: .8rem;
    color: #6b7280;
    width: 64px;
    flex: 0 0 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chip {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 0;
    padding: 0;
    cursor: pointer;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
    animation: pop .18s ease-out;
  }
  .chip:hover { transform: scale(1.15); }
  .chip:active { transform: scale(.9); }
  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }
  .add-chip {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px dashed #cbd5e1;
    background: transparent;
    color: #94a3b8;
    font-size: .8rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .add-chip:hover { border-color: #6b7280; color: #6b7280; transform: scale(1.1); }
  .count {
    font-size: .75rem;
    color: #9ca3af;
    font-variant-numeric: tabular-nums;
    margin-left: 2px;
  }

  .actions {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 14px 20px;
    background: linear-gradient(180deg, rgba(248,249,251,0), #f8f9fb 40%);
  }
  .actions button {
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #374151;
    font-weight: 600;
    font-size: .85rem;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(15,23,42,.06);
  }
  .actions button:hover { background: #f9fafb; }
  .actions .primary { background: #111827; color: #fff; border-color: #111827; }
  .actions .primary:hover { background: #1f2937; }
  .actions .ghost { color: #9ca3af; box-shadow: none; }
</style>
</head>
<body>
<header>
  <h1>Haushaltsgame <span>· Punkteübersicht</span></h1>
  <div id="totals" class="totals"></div>
</header>
<main id="tasks"></main>
<div class="actions">
  <button class="primary" id="addTask">+ Aufgabe</button>
  <button id="addPerson">+ Person</button>
  <button class="ghost" id="reset">Zurücksetzen</button>
</div>
<script>
(function () {
  var KEY = "haushaltsgame.v1";
  var PALETTE = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316"];

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function initials(name) {
    return name.trim().split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join("").toUpperCase();
  }

  function seed() {
    var p1 = uid(), p2 = uid();
    return {
      people: [
        { id: p1, name: "Anna", color: PALETTE[0] },
        { id: p2, name: "Jonas", color: PALETTE[3] }
      ],
      tasks: [
        { id: uid(), name: "Geschirrspüler", counts: (function () { var c = {}; c[p1] = 3; c[p2] = 1; return c; })() },
        { id: uid(), name: "Müll rausbringen", counts: (function () { var c = {}; c[p1] = 0; c[p2] = 2; return c; })() },
        { id: uid(), name: "Staubsaugen", counts: (function () { var c = {}; c[p1] = 1; c[p2] = 0; return c; })() }
      ]
    };
  }

  var state;
  try {
    state = JSON.parse(localStorage.getItem(KEY)) || seed();
  } catch (e) {
    state = seed();
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function countOf(task, personId) {
    var c = task.counts[personId];
    return typeof c === "number" ? c : 0;
  }

  function totalOf(personId) {
    return state.tasks.reduce(function (sum, t) { return sum + countOf(t, personId); }, 0);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function avatar(person) {
    var a = el("div", "avatar", initials(person.name));
    a.style.background = person.color;
    a.title = person.name;
    return a;
  }

  function renderTotals() {
    var box = document.getElementById("totals");
    box.innerHTML = "";
    var sorted = state.people.slice().sort(function (a, b) { return totalOf(b.id) - totalOf(a.id); });
    sorted.forEach(function (p) {
      var card = el("div", "total-card");
      card.appendChild(avatar(p));
      card.appendChild(el("span", "name", p.name));
      var score = el("span", "score", String(totalOf(p.id)));
      score.style.background = p.color;
      card.appendChild(score);
      box.appendChild(card);
    });
  }

  function renderTasks() {
    var main = document.getElementById("tasks");
    main.innerHTML = "";
    state.tasks.forEach(function (task) {
      var card = el("div", "task");

      var head = el("div", "task-head");
      var title = el("h2", null, task.name);
      var total = state.people.reduce(function (s, p) { return s + countOf(task, p.id); }, 0);
      var sub = el("span", "sub", total === 1 ? "1× erledigt" : total + "× erledigt");
      var hgroup = el("div");
      hgroup.appendChild(title);
      hgroup.appendChild(sub);
      head.appendChild(hgroup);

      var del = el("button", "del", "\u00d7");
      del.title = "Aufgabe löschen";
      del.addEventListener("click", function () {
        state.tasks = state.tasks.filter(function (t) { return t.id !== task.id; });
        save(); render();
      });
      head.appendChild(del);
      card.appendChild(head);

      state.people.forEach(function (p) {
        var row = el("div", "row");
        var av = avatar(p);
        av.classList.add("small");
        row.appendChild(av);

        row.appendChild(el("div", "name", p.name));

        var chips = el("div", "chips");
        var n = countOf(task, p.id);
        for (var i = 0; i < n; i++) {
          (function (idx) {
            var chip = el("button", "chip");
            chip.style.background = p.color;
            chip.title = "Entfernen";
            chip.addEventListener("click", function () {
              task.counts[p.id] = Math.max(0, countOf(task, p.id) - 1);
              save(); render();
            });
            chips.appendChild(chip);
          })(i);
        }
        var add = el("button", "add-chip", "+");
        add.title = "Hinzufügen";
        add.addEventListener("click", function () {
          task.counts[p.id] = countOf(task, p.id) + 1;
          save(); render();
        });
        chips.appendChild(add);

        if (n > 0) chips.appendChild(el("span", "count", n + "\u00d7"));
        row.appendChild(chips);
        card.appendChild(row);
      });

      main.appendChild(card);
    });
  }

  function render() {
    renderTotals();
    renderTasks();
  }

  document.getElementById("addTask").addEventListener("click", function () {
    var name = prompt("Name der Aufgabe?");
    if (!name || !name.trim()) return;
    var counts = {};
    state.people.forEach(function (p) { counts[p.id] = 0; });
    state.tasks.push({ id: uid(), name: name.trim(), counts: counts });
    save(); render();
  });

  document.getElementById("addPerson").addEventListener("click", function () {
    var name = prompt("Name der Person?");
    if (!name || !name.trim()) return;
    var color = PALETTE[state.people.length % PALETTE.length];
    var person = { id: uid(), name: name.trim(), color: color };
    state.people.push(person);
    state.tasks.forEach(function (t) { t.counts[person.id] = 0; });
    save(); render();
  });

  document.getElementById("reset").addEventListener("click", function () {
    if (!confirm("Alle Daten zurücksetzen?")) return;
    localStorage.removeItem(KEY);
    state = seed();
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
