<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haushaltsgame</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef1f6 0%, #f8f9fb 300px);
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    padding: 24px 20px 10px;
    max-width: 720px;
    margin: 0 auto;
  }
  .totals {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .total-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 6px 12px 6px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  }
  .total-card .name { font-weight: 600; font-size: .9rem; }
  .total-card .rm {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: .95rem;
    line-height: 1;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 6px;
  }
  .total-card .rm:hover { color: #ef4444; background: #fef2f2; }
  .total-card .score {
    font-weight: 800;
    font-size: 1rem;
    color: #fff;
    border-radius: 999px;
    min-width: 30px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 9px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: .85rem;
    flex: 0 0 auto;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    user-select: none;
    cursor: pointer;
    position: relative;
    background-size: cover;
    background-position: center;
    transition: box-shadow .15s, transform .15s;
  }
  .avatar:hover { box-shadow: 0 0 0 3px rgba(17,24,39,.15); }
  .avatar:active { transform: scale(.95); }
  .avatar.small { width: 34px; height: 34px; font-size: .78rem; }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .task {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(15,23,42,.05);
  }
  .task-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .task-head h2 {
    font-size: 1rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .del {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 8px;
  }
  .del:hover { color: #ef4444; background: #fef2f2; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
  }
  .row + .row { border-top: 1px dashed #f1f5f9; }
  .row .name {
    font-size: .8rem;
    color: #6b7280;
    width: 64px;
    flex: 0 0 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chip {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 0;
    padding: 0;
    cursor: pointer;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
    animation: pop .18s ease-out;
  }
  .chip:hover { transform: scale(1.15); }
  .chip:active { transform: scale(.9); }
  @keyframes pop {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }
  .add-chip {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px dashed #cbd5e1;
    background: transparent;
    color: #94a3b8;
    font-size: .8rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .add-chip:hover { border-color: #6b7280; color: #6b7280; transform: scale(1.1); }
  .count {
    font-size: .75rem;
    color: #9ca3af;
    font-variant-numeric: tabular-nums;
    margin-left: 2px;
  }

  .add-person {
    border: 1.5px dashed #cbd5e1;
    background: #fff;
    color: #6b7280;
    font-weight: 600;
    font-size: .85rem;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all .15s;
  }
  .add-person:hover { border-color: #94a3b8; color: #374151; }

  .add-task {
    border: 1.5px dashed #cbd5e1;
    background: rgba(255,255,255,.5);
    color: #6b7280;
    font-weight: 600;
    font-size: .9rem;
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    width: 100%;
    transition: all .15s;
  }
  .add-task:hover { border-color: #94a3b8; color: #374151; background: #fff; }

  .reset-link {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: .78rem;
    cursor: pointer;
    padding: 8px;
    align-self: center;
  }
  .reset-link:hover { color: #ef4444; }
</style>
</head>
<body>
<header>
  <div id="totals" class="totals"></div>
</header>
<main id="tasks"></main>
<script>
(function () {
  var KEY = "haushaltsgame.v1";
  var PALETTE = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316"];

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function initials(name) {
    return name.trim().split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join("").toUpperCase();
  }

  function seed() {
    var p1 = uid(), p2 = uid();
    return {
      people: [
        { id: p1, name: "Anna", color: PALETTE[0] },
        { id: p2, name: "Jonas", color: PALETTE[3] }
      ],
      tasks: [
        { id: uid(), name: "Geschirrspüler", counts: (function () { var c = {}; c[p1] = 3; c[p2] = 1; return c; })() },
        { id: uid(), name: "Müll rausbringen", counts: (function () { var c = {}; c[p1] = 0; c[p2] = 2; return c; })() },
        { id: uid(), name: "Staubsaugen", counts: (function () { var c = {}; c[p1] = 1; c[p2] = 0; return c; })() }
      ]
    };
  }

  var state;
  try {
    state = JSON.parse(localStorage.getItem(KEY)) || seed();
  } catch (e) {
    state = seed();
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function countOf(task, personId) {
    var c = task.counts[personId];
    return typeof c === "number" ? c : 0;
  }

  function totalOf(personId) {
    return state.tasks.reduce(function (sum, t) { return sum + countOf(t, personId); }, 0);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function avatar(person) {
    var a = el("div", "avatar");
    a.title = person.name + " \u00b7 Foto \u00e4ndern";
    a.style.backgroundColor = person.color;
    if (person.photo) {
      a.style.backgroundImage = "url(" + person.photo + ")";
      a.style.backgroundSize = "cover";
      a.style.backgroundPosition = "center";
    } else {
      a.textContent = initials(person.name);
    }
    a.addEventListener("click", function () { pickPhoto(person); });
    return a;
  }

  var fileInput = el("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  fileInput.style.display = "none";
  document.body.appendChild(fileInput);
  var pendingPerson = null;

  function pickPhoto(person) {
    pendingPerson = person;
    fileInput.value = "";
    fileInput.click();
  }

  function resizeImage(file, size, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext("2d");
        var s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        cb(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file || !pendingPerson) return;
    var person = pendingPerson;
    resizeImage(file, 160, function (dataUrl) {
      person.photo = dataUrl;
      pendingPerson = null;
      save();
      render();
    });
  });

  function renderTotals() {
    var box = document.getElementById("totals");
    box.innerHTML = "";
    var sorted = state.people.slice().sort(function (a, b) { return totalOf(b.id) - totalOf(a.id); });
    sorted.forEach(function (p) {
      var card = el("div", "total-card");
      card.appendChild(avatar(p));
      card.appendChild(el("span", "name", p.name));
      var score = el("span", "score", String(totalOf(p.id)));
      score.style.background = p.color;
      card.appendChild(score);
      var rm = el("button", "rm", "\u00d7");
      rm.title = "Person l\u00f6schen";
      rm.addEventListener("click", function () {
        if (!confirm(p.name + " l\u00f6schen? Alle Punkte dieser Person gehen verloren.")) return;
        state.people = state.people.filter(function (x) { return x.id !== p.id; });
        state.tasks.forEach(function (t) { delete t.counts[p.id]; });
        save(); render();
      });
      card.appendChild(rm);
      box.appendChild(card);
    });
    var addP = el("button", "add-person", "+ Person");
    addP.addEventListener("click", addPersonFlow);
    box.appendChild(addP);
  }

  function renderTasks() {
    var main = document.getElementById("tasks");
    main.innerHTML = "";
    state.tasks.forEach(function (task) {
      var card = el("div", "task");

      var head = el("div", "task-head");
      var title = el("h2", null, task.name);
      head.appendChild(title);

      var del = el("button", "del", "\u00d7");
      del.title = "Aufgabe löschen";
      del.addEventListener("click", function () {
        state.tasks = state.tasks.filter(function (t) { return t.id !== task.id; });
        save(); render();
      });
      head.appendChild(del);
      card.appendChild(head);

      state.people.forEach(function (p) {
        var row = el("div", "row");
        var av = avatar(p);
        av.classList.add("small");
        row.appendChild(av);

        row.appendChild(el("div", "name", p.name));

        var chips = el("div", "chips");
        var n = countOf(task, p.id);
        for (var i = 0; i < n; i++) {
          (function (idx) {
            var chip = el("button", "chip");
            chip.style.background = p.color;
            chip.title = "Entfernen";
            chip.addEventListener("click", function () {
              task.counts[p.id] = Math.max(0, countOf(task, p.id) - 1);
              save(); render();
            });
            chips.appendChild(chip);
          })(i);
        }
        var add = el("button", "add-chip", "+");
        add.title = "Hinzufügen";
        add.addEventListener("click", function () {
          task.counts[p.id] = countOf(task, p.id) + 1;
          save(); render();
        });
        chips.appendChild(add);

        if (n > 0) chips.appendChild(el("span", "count", n + "\u00d7"));
        row.appendChild(chips);
        card.appendChild(row);
      });

      main.appendChild(card);
    });
    var addT = el("button", "add-task", "+ Aufgabe");
    addT.addEventListener("click", addTaskFlow);
    main.appendChild(addT);
    var reset = el("button", "reset-link", "Zur\u00fccksetzen");
    reset.addEventListener("click", resetFlow);
    main.appendChild(reset);
  }

  function render() {
    renderTotals();
    renderTasks();
  }

  function addTaskFlow() {
    var name = prompt("Name der Aufgabe?");
    if (!name || !name.trim()) return;
    var counts = {};
    state.people.forEach(function (p) { counts[p.id] = 0; });
    state.tasks.push({ id: uid(), name: name.trim(), counts: counts });
    save(); render();
  }

  function addPersonFlow() {
    var name = prompt("Name der Person?");
    if (!name || !name.trim()) return;
    var color = PALETTE[state.people.length % PALETTE.length];
    var person = { id: uid(), name: name.trim(), color: color };
    state.people.push(person);
    state.tasks.forEach(function (t) { t.counts[person.id] = 0; });
    save(); render();
  }

  function resetFlow() {
    if (!confirm("Alle Daten zur\u00fccksetzen?")) return;
    localStorage.removeItem(KEY);
    state = seed();
    save(); render();
  }

  render();
})();
</script>
</body>
</html>
