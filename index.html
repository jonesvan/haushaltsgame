<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haushaltsgame</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef1f6 0%, #f8f9fb 300px);
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    padding: 24px 20px 10px;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  .sidekick-link {
    position: absolute;
    top: 20px;
    right: 20px;
    text-decoration: none;
    font-size: .82rem;
    font-weight: 700;
    color: #374151;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: 0 2px 8px rgba(15,23,42,.05);
    transition: transform .15s, box-shadow .15s;
  }
  .sidekick-link:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(15,23,42,.1); }
  .sidekick-link:active { transform: scale(.96); }
  .totals {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .total-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 6px 12px 6px 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  }
  .total-card .name { font-weight: 600; font-size: .9rem; }
  .total-card .rm {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: .95rem;
    line-height: 1;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 6px;
  }
  .total-card .rm:hover { color: #ef4444; background: #fef2f2; }
  .total-card .score {
    font-weight: 800;
    font-size: 1rem;
    color: #fff;
    border-radius: 999px;
    min-width: 30px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 9px;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: .85rem;
    flex: 0 0 auto;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
    user-select: none;
    cursor: pointer;
    position: relative;
    background-size: cover;
    background-position: center;
    transition: box-shadow .15s, transform .15s;
  }
  .avatar:hover { box-shadow: 0 0 0 3px rgba(17,24,39,.15); }
  .avatar:active { transform: scale(.95); }
  .avatar.small { width: 34px; height: 34px; font-size: .78rem; }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .task {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(15,23,42,.05);
  }
  .task-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .task-head h2 {
    font-size: 1rem;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .del {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 8px;
  }
  .del:hover { color: #ef4444; background: #fef2f2; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
  }
  .row + .row { border-top: 1px dashed #f1f5f9; }
  .row .name {
    font-size: .8rem;
    color: #6b7280;
    width: 64px;
    flex: 0 0 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .chip {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 0;
    padding: 0;
    cursor: pointer;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
    transition: transform .12s ease;
    will-change: transform;
  }
  .chip:hover { transform: scale(1.2); }
  .chip:active { transform: scale(.82); }
  .chip.pop { animation: chipPop .34s cubic-bezier(.2,1.5,.3,1); }
  .chip.removing { animation: chipOut .22s ease-in forwards; pointer-events: none; }
  @keyframes chipPop {
    0% { transform: scale(0); }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  @keyframes chipOut {
    to { transform: scale(0); opacity: 0; }
  }
  .add-chip {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px dashed #cbd5e1;
    background: transparent;
    color: #94a3b8;
    font-size: .8rem;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .add-chip:hover { border-color: #6b7280; color: #6b7280; transform: scale(1.18) rotate(90deg); }
  .add-chip:active { transform: scale(.8) rotate(90deg); }
  .count {
    font-size: .75rem;
    color: #9ca3af;
    font-variant-numeric: tabular-nums;
    margin-left: 2px;
  }

  .add-person {
    border: 1.5px dashed #cbd5e1;
    background: #fff;
    color: #6b7280;
    font-weight: 600;
    font-size: .85rem;
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all .15s;
  }
  .add-person:hover { border-color: #94a3b8; color: #374151; }

  .add-task {
    border: 1.5px dashed #cbd5e1;
    background: rgba(255,255,255,.5);
    color: #6b7280;
    font-weight: 600;
    font-size: .9rem;
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    width: 100%;
    transition: all .15s;
  }
  .add-task:hover { border-color: #94a3b8; color: #374151; background: #fff; }

  .reset-link {
    border: 0;
    background: transparent;
    color: #cbd5e1;
    font-size: .78rem;
    cursor: pointer;
    padding: 8px;
    align-self: center;
  }
  .reset-link:hover { color: #ef4444; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to { opacity: 1; transform: none; }
  }
  .total-card { animation: cardIn .4s cubic-bezier(.2,.9,.3,1) backwards; }
  .task { animation: cardIn .4s cubic-bezier(.2,.9,.3,1) backwards; }
  .total-card:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 10px 24px rgba(15,23,42,.08); }

  .score.bump { animation: bump .5s cubic-bezier(.2,1.6,.3,1); }
  @keyframes bump {
    0% { transform: scale(1); }
    35% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  .spark {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 999;
    transform: translate(-50%, -50%);
  }

  .add-person:active, .add-task:active { transform: scale(.97); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<header>
  <a class="sidekick-link" href="sidekick.html" target="_blank" rel="noopener">🐣 Sidekick</a>
  <div id="totals" class="totals"></div>
</header>
<main id="tasks"></main>
<script>
(function () {
  var KEY = "haushaltsgame.v1";
  var PALETTE = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6", "#f97316"];

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function initials(name) {
    return name.trim().split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join("").toUpperCase();
  }

  function seed() {
    var p1 = uid(), p2 = uid();
    return {
      people: [
        { id: p1, name: "Anna", color: PALETTE[0] },
        { id: p2, name: "Jonas", color: PALETTE[3] }
      ],
      tasks: [
        { id: uid(), name: "Geschirrspüler", counts: (function () { var c = {}; c[p1] = 3; c[p2] = 1; return c; })() },
        { id: uid(), name: "Müll rausbringen", counts: (function () { var c = {}; c[p1] = 0; c[p2] = 2; return c; })() },
        { id: uid(), name: "Staubsaugen", counts: (function () { var c = {}; c[p1] = 1; c[p2] = 0; return c; })() }
      ]
    };
  }

  var state;
  try {
    state = JSON.parse(localStorage.getItem(KEY)) || seed();
  } catch (e) {
    state = seed();
  }

  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function countOf(task, personId) {
    var c = task.counts[personId];
    return typeof c === "number" ? c : 0;
  }

  function totalOf(personId) {
    return state.tasks.reduce(function (sum, t) { return sum + countOf(t, personId); }, 0);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function avatar(person) {
    var a = el("div", "avatar");
    a.title = person.name + " \u00b7 Foto \u00e4ndern";
    a.style.backgroundColor = person.color;
    if (person.photo) {
      a.style.backgroundImage = "url(" + person.photo + ")";
      a.style.backgroundSize = "cover";
      a.style.backgroundPosition = "center";
    } else {
      a.textContent = initials(person.name);
    }
    a.addEventListener("click", function () { pickPhoto(person); });
    return a;
  }

  var fileInput = el("input");
  fileInput.type = "file";
  fileInput.accept = "image/*";
  fileInput.style.display = "none";
  document.body.appendChild(fileInput);
  var pendingPerson = null;

  function pickPhoto(person) {
    pendingPerson = person;
    fileInput.value = "";
    fileInput.click();
  }

  function resizeImage(file, size, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var canvas = document.createElement("canvas");
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext("2d");
        var s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        cb(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file || !pendingPerson) return;
    var person = pendingPerson;
    resizeImage(file, 160, function (dataUrl) {
      person.photo = dataUrl;
      pendingPerson = null;
      save();
      render();
    });
  });

  var scoreEls = {};
  var raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : function (cb) { return setTimeout(function () { cb(performance.now()); }, 16); };
  var canAnimate = typeof document.createElement("div").animate === "function";

  function animateNumber(node, from, to) {
    if (from === to) { node.textContent = String(to); return; }
    var start = performance.now();
    var dur = 420;
    (function frame(now) {
      if (now === undefined) now = performance.now();
      var t = Math.min(1, (now - start) / dur);
      var e = 1 - Math.pow(1 - t, 3);
      node.textContent = String(Math.round(from + (to - from) * e));
      if (t < 1) raf(frame);
    })();
  }

  function burst(x, y, color) {
    for (var i = 0; i < 9; i++) {
      (function () {
        var s = document.createElement("div");
        s.className = "spark";
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.background = color;
        document.body.appendChild(s);
        if (!canAnimate) { s.remove(); return; }
        var angle = Math.random() * Math.PI * 2;
        var dist = 20 + Math.random() * 32;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist;
        var anim = s.animate([
          { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
          { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(0)", opacity: 0 }
        ], { duration: 480 + Math.random() * 260, easing: "cubic-bezier(.2,.7,.3,1)" });
        anim.onfinish = function () { s.remove(); };
      })();
    }
  }

  function resortTotals() {
    var box = document.getElementById("totals");
    var cards = Array.prototype.slice.call(box.querySelectorAll(".total-card"));
    if (cards.length < 2) return;
    var first = {};
    cards.forEach(function (c) { first[c.dataset.pid] = c.getBoundingClientRect(); });
    var sorted = state.people.slice().sort(function (a, b) { return totalOf(b.id) - totalOf(a.id); });
    var addP = box.querySelector(".add-person");
    sorted.forEach(function (p) {
      var c = scoreEls[p.id] && scoreEls[p.id].card;
      if (c) box.insertBefore(c, addP);
    });
    if (!canAnimate) return;
    cards.forEach(function (c) {
      var f = first[c.dataset.pid];
      var l = c.getBoundingClientRect();
      var dx = f.left - l.left, dy = f.top - l.top;
      if (dx || dy) {
        c.animate([{ transform: "translate(" + dx + "px," + dy + "px)" }, { transform: "none" }],
          { duration: 420, easing: "cubic-bezier(.2,.9,.3,1)" });
      }
    });
  }

  function updateScore(pid) {
    var entry = scoreEls[pid];
    if (!entry) return;
    var to = totalOf(pid);
    animateNumber(entry.score, entry.value, to);
    entry.value = to;
    entry.score.classList.remove("bump");
    void entry.score.offsetWidth;
    entry.score.classList.add("bump");
    resortTotals();
  }

  function renderTotals() {
    var box = document.getElementById("totals");
    box.innerHTML = "";
    scoreEls = {};
    var sorted = state.people.slice().sort(function (a, b) { return totalOf(b.id) - totalOf(a.id); });
    sorted.forEach(function (p) {
      var total = totalOf(p.id);
      var card = el("div", "total-card");
      card.dataset.pid = p.id;
      card.appendChild(avatar(p));
      card.appendChild(el("span", "name", p.name));
      var score = el("span", "score", String(total));
      score.style.background = p.color;
      card.appendChild(score);
      var rm = el("button", "rm", "\u00d7");
      rm.title = "Person l\u00f6schen";
      rm.addEventListener("click", function () {
        if (!confirm(p.name + " l\u00f6schen? Alle Punkte dieser Person gehen verloren.")) return;
        state.people = state.people.filter(function (x) { return x.id !== p.id; });
        state.tasks.forEach(function (t) { delete t.counts[p.id]; });
        save(); render();
      });
      card.appendChild(rm);
      box.appendChild(card);
      scoreEls[p.id] = { card: card, score: score, value: total };
    });
    var addP = el("button", "add-person", "+ Person");
    addP.addEventListener("click", addPersonFlow);
    box.appendChild(addP);
  }

  function createRow(task, p) {
    var row = el("div", "row");
    var av = avatar(p);
    av.classList.add("small");
    row.appendChild(av);
    row.appendChild(el("div", "name", p.name));

    var chips = el("div", "chips");
    var add = el("button", "add-chip", "+");
    add.title = "Hinzuf\u00fcgen";
    var count = el("span", "count");

    function makeChip(popping) {
      var chip = el("button", "chip");
      chip.style.background = p.color;
      chip.title = "Entfernen";
      if (popping) chip.classList.add("pop");
      chip.addEventListener("click", function (e) {
        if (countOf(task, p.id) <= 0) return;
        task.counts[p.id] = countOf(task, p.id) - 1;
        burst(e.clientX, e.clientY, p.color);
        chip.classList.add("removing");
        chip.disabled = true;
        var done = false;
        function remove() {
          if (done) return;
          done = true;
          chip.remove();
          refresh();
        }
        chip.addEventListener("animationend", remove);
        setTimeout(remove, 300);
        save();
      });
      return chip;
    }

    function refresh() {
      var n = countOf(task, p.id);
      count.textContent = n > 0 ? n + "\u00d7" : "";
      updateScore(p.id);
    }

    add.addEventListener("click", function (e) {
      task.counts[p.id] = countOf(task, p.id) + 1;
      chips.insertBefore(makeChip(true), add);
      burst(e.clientX, e.clientY, p.color);
      refresh();
      save();
    });

    var n = countOf(task, p.id);
    for (var i = 0; i < n; i++) chips.appendChild(makeChip(false));
    chips.appendChild(add);
    count.textContent = n > 0 ? n + "\u00d7" : "";
    chips.appendChild(count);
    row.appendChild(chips);
    return row;
  }

  function renderTasks() {
    var main = document.getElementById("tasks");
    main.innerHTML = "";
    state.tasks.forEach(function (task) {
      var card = el("div", "task");
      var head = el("div", "task-head");
      head.appendChild(el("h2", null, task.name));
      var del = el("button", "del", "\u00d7");
      del.title = "Aufgabe l\u00f6schen";
      del.addEventListener("click", function () {
        state.tasks = state.tasks.filter(function (t) { return t.id !== task.id; });
        save(); render();
      });
      head.appendChild(del);
      card.appendChild(head);
      state.people.forEach(function (p) { card.appendChild(createRow(task, p)); });
      main.appendChild(card);
    });
    var addT = el("button", "add-task", "+ Aufgabe");
    addT.addEventListener("click", addTaskFlow);
    main.appendChild(addT);
    var reset = el("button", "reset-link", "Zur\u00fccksetzen");
    reset.addEventListener("click", resetFlow);
    main.appendChild(reset);
  }

  function render() {
    renderTotals();
    renderTasks();
  }

  function addTaskFlow() {
    var name = prompt("Name der Aufgabe?");
    if (!name || !name.trim()) return;
    var counts = {};
    state.people.forEach(function (p) { counts[p.id] = 0; });
    state.tasks.push({ id: uid(), name: name.trim(), counts: counts });
    save(); render();
  }

  function addPersonFlow() {
    var name = prompt("Name der Person?");
    if (!name || !name.trim()) return;
    var color = PALETTE[state.people.length % PALETTE.length];
    var person = { id: uid(), name: name.trim(), color: color };
    state.people.push(person);
    state.tasks.forEach(function (t) { t.counts[person.id] = 0; });
    save(); render();
  }

  function resetFlow() {
    if (!confirm("Alle Daten zur\u00fccksetzen?")) return;
    localStorage.removeItem(KEY);
    state = seed();
    save(); render();
  }

  render();
})();
</script>
</body>
</html>
