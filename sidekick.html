<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidekick-Shop</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #eef1f6 0%, #f8f9fb 300px);
    color: #1f2937;
    min-height: 100vh;
    padding-bottom: 50px;
  }
  .topbar {
    max-width: 860px;
    margin: 0 auto;
    padding: 18px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .back {
    text-decoration: none;
    color: #6b7280;
    font-size: .85rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid #e5e7eb;
    background: #fff;
  }
  .back:hover { color: #111827; background: #f9fafb; }
  .coins {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 800;
    font-size: .95rem;
    box-shadow: 0 4px 12px rgba(15,23,42,.05);
    font-variant-numeric: tabular-nums;
  }
  .coins .earned { font-weight: 500; font-size: .72rem; color: #9ca3af; }
  .coins.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .hero {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage {
    position: relative;
    width: 300px;
    height: 280px;
    border-radius: 24px;
    background: linear-gradient(180deg, #dbeafe, #eff6ff);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(15,23,42,.08);
    transition: background .4s ease;
  }
  .character {
    position: relative;
    width: 210px;
    height: 210px;
    margin-bottom: 14px;
    animation: bob 3.2s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  .character.bounce { animation: bounce .55s cubic-bezier(.2,1.6,.3,1); }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @keyframes bounce {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-22px) scale(1.04); }
    55% { transform: translateY(0) scale(.96); }
    100% { transform: translateY(0) scale(1); }
  }
  .character svg { width: 100%; height: 100%; display: block; }
  .slot {
    position: absolute;
    line-height: 1;
    pointer-events: none;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.12));
  }
  .slot[data-slot="companion"] { left: -14px; bottom: 2px; font-size: 46px; z-index: 1; }
  .slot[data-slot="hat"] { top: -20px; left: 50%; transform: translateX(-50%); font-size: 48px; z-index: 5; }
  .slot[data-slot="face"] { top: 58px; left: 50%; transform: translateX(-50%); font-size: 40px; z-index: 6; }
  .slot[data-slot="outfit"] { top: 120px; left: 50%; transform: translateX(-50%); font-size: 54px; z-index: 4; }
  .slot[data-slot="hand"] { top: 112px; right: -18px; font-size: 42px; z-index: 3; }

  .sparkle {
    position: absolute;
    font-size: 22px;
    pointer-events: none;
    animation: sparkleUp 900ms ease-out forwards;
    z-index: 20;
  }
  @keyframes sparkleUp {
    0% { opacity: 0; transform: translateY(10px) scale(.4); }
    25% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
  }

  .petname {
    font-size: 1.15rem;
    margin: 18px 0 2px;
    cursor: pointer;
    letter-spacing: -.01em;
  }
  .petname:hover::after { content: " ✏️"; font-size: .8rem; }
  .hint { color: #9ca3af; font-size: .8rem; margin: 4px 0 0; text-align: center; }

  .filters {
    max-width: 860px;
    margin: 6px auto 0;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .filters button {
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #4b5563;
    font-weight: 600;
    font-size: .8rem;
    border-radius: 999px;
    padding: 8px 15px;
    cursor: pointer;
    transition: all .15s;
  }
  .filters button:hover { background: #f9fafb; }
  .filters button.active { background: #111827; color: #fff; border-color: #111827; }

  .shop {
    max-width: 860px;
    margin: 0 auto;
    padding: 18px 20px 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }
  .item {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 14px 12px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 6px 16px rgba(15,23,42,.04);
    animation: cardIn .35s cubic-bezier(.2,.9,.3,1) backwards;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .item .pic { font-size: 40px; line-height: 1; height: 44px; display: flex; align-items: center; }
  .item .label { font-size: .82rem; font-weight: 600; }
  .item .cat { font-size: .68rem; color: #9ca3af; margin-top: -4px; }
  .item button {
    border: 1px solid #e5e7eb;
    background: #f9fafb;
    color: #374151;
    font-weight: 700;
    font-size: .8rem;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    width: 100%;
    transition: all .15s;
  }
  .item button:hover { background: #f3f4f6; }
  .item button.buy { background: #111827; color: #fff; border-color: #111827; }
  .item button.buy:hover { background: #1f2937; }
  .item button.poor { background: #f3f4f6; color: #b6bcc6; border-color: #eef0f3; }
  .item button.owned { background: #ecfdf5; color: #059669; border-color: #a7f3d0; }
  .item button.equipped { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
  .item.owned-item { border-color: #d1fae5; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 20px);
    background: #111827;
    color: #fff;
    font-size: .85rem;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">&larr; Haushalt</a>
  <div class="coins" id="coins">
    <span>🪙</span><span id="balance">0</span>
    <span class="earned" id="earned"></span>
  </div>
</div>

<section class="hero">
  <div class="stage" id="stage">
    <div class="character" id="character">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c7d2fe"/>
            <stop offset="1" stop-color="#a5b4fc"/>
          </linearGradient>
        </defs>
        <ellipse cx="100" cy="184" rx="54" ry="9" fill="rgba(0,0,0,.10)"/>
        <ellipse cx="78" cy="178" rx="16" ry="10" fill="#818cf8"/>
        <ellipse cx="122" cy="178" rx="16" ry="10" fill="#818cf8"/>
        <path d="M100 26 C 150 26, 162 78, 162 112 C 162 156, 134 176, 100 176 C 66 176, 38 156, 38 112 C 38 78, 50 26, 100 26 Z" fill="url(#body)"/>
        <ellipse cx="34" cy="120" rx="13" ry="20" fill="#a5b4fc"/>
        <ellipse cx="166" cy="120" rx="13" ry="20" fill="#a5b4fc"/>
        <circle cx="80" cy="92" r="13" fill="#fff"/>
        <circle cx="120" cy="92" r="13" fill="#fff"/>
        <circle cx="83" cy="95" r="6.5" fill="#312e81"/>
        <circle cx="123" cy="95" r="6.5" fill="#312e81"/>
        <circle cx="85" cy="92" r="2.2" fill="#fff"/>
        <circle cx="125" cy="92" r="2.2" fill="#fff"/>
        <circle cx="62" cy="112" r="8" fill="#fca5a5" opacity=".5"/>
        <circle cx="138" cy="112" r="8" fill="#fca5a5" opacity=".5"/>
        <path d="M88 112 Q100 124 112 112" stroke="#4338ca" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="slot" data-slot="companion"></div>
      <div class="slot" data-slot="hat"></div>
      <div class="slot" data-slot="face"></div>
      <div class="slot" data-slot="outfit"></div>
      <div class="slot" data-slot="hand"></div>
    </div>
  </div>
  <h1 class="petname" id="petname" title="Klicken zum Umbenennen">Momo</h1>
  <p class="hint" id="hint">Verdiene Coins mit Haushaltsaufgaben und style deinen Sidekick.</p>
</section>

<nav class="filters" id="filters"></nav>
<main class="shop" id="shop"></main>
<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = "haushaltsgame.v1";
  var DEFAULT_BG = "linear-gradient(180deg, #dbeafe, #eff6ff)";

  var CATS = [
    { slot: "all", label: "Alle" },
    { slot: "outfit", label: "Kleidung" },
    { slot: "hat", label: "Kopf" },
    { slot: "face", label: "Gesicht" },
    { slot: "hand", label: "Hand" },
    { slot: "companion", label: "Begleiter" },
    { slot: "bg", label: "Hintergrund" }
  ];

  var ITEMS = [
    { id: "shirt", name: "T-Shirt", emoji: "\ud83d\udc55", slot: "outfit", price: 6 },
    { id: "vest", name: "Warnweste", emoji: "\ud83e\uddba", slot: "outfit", price: 8 },
    { id: "coat", name: "Jacke", emoji: "\ud83e\udde5", slot: "outfit", price: 12 },
    { id: "dress", name: "Kleid", emoji: "\ud83d\udc57", slot: "outfit", price: 14 },
    { id: "cap", name: "Cap", emoji: "\ud83e\udde2", slot: "hat", price: 6 },
    { id: "flower", name: "Blume", emoji: "\ud83c\udf38", slot: "hat", price: 8 },
    { id: "grad", name: "Doktorhut", emoji: "\ud83c\udf93", slot: "hat", price: 16 },
    { id: "tophat", name: "Zylinder", emoji: "\ud83c\udfa9", slot: "hat", price: 18 },
    { id: "crown", name: "Krone", emoji: "\ud83d\udc51", slot: "hat", price: 30 },
    { id: "glasses", name: "Brille", emoji: "\ud83d\udc53", slot: "face", price: 6 },
    { id: "sunglasses", name: "Sonnenbrille", emoji: "\ud83d\udd76\ufe0f", slot: "face", price: 8 },
    { id: "disguise", name: "Verkleidung", emoji: "\ud83e\udd78", slot: "face", price: 10 },
    { id: "balloon", name: "Ballon", emoji: "\ud83c\udf88", slot: "hand", price: 4 },
    { id: "icecream", name: "Eis", emoji: "\ud83c\udf66", slot: "hand", price: 6 },
    { id: "umbrella", name: "Regenschirm", emoji: "\u2602\ufe0f", slot: "hand", price: 8 },
    { id: "plant", name: "Pflanze", emoji: "\ud83e\udeb4", slot: "hand", price: 10 },
    { id: "cactus", name: "Kaktus", emoji: "\ud83c\udf35", slot: "hand", price: 12 },
    { id: "teddy", name: "Teddy", emoji: "\ud83e\uddf8", slot: "hand", price: 14 },
    { id: "butterfly", name: "Schmetterling", emoji: "\ud83e\udd8b", slot: "companion", price: 12 },
    { id: "chick", name: "K\u00fcken", emoji: "\ud83d\udc24", slot: "companion", price: 15 },
    { id: "turtle", name: "Schildkr\u00f6te", emoji: "\ud83d\udc22", slot: "companion", price: 20 },
    { id: "dog", name: "Hund", emoji: "\ud83d\udc36", slot: "companion", price: 25 },
    { id: "cat", name: "Katze", emoji: "\ud83d\udc31", slot: "companion", price: 25 },
    { id: "bg-day", name: "Tag", emoji: "\u2600\ufe0f", slot: "bg", price: 10, bg: "linear-gradient(180deg, #bae6fd, #eff6ff)" },
    { id: "bg-sunset", name: "Sonnenuntergang", emoji: "\ud83c\udf07", slot: "bg", price: 15, bg: "linear-gradient(180deg, #fdba74, #fecaca)" },
    { id: "bg-night", name: "Nacht", emoji: "\ud83c\udf19", slot: "bg", price: 15, bg: "linear-gradient(180deg, #1e1b4b, #4c1d95)" },
    { id: "bg-forest", name: "Wald", emoji: "\ud83c\udf32", slot: "bg", price: 18, bg: "linear-gradient(180deg, #86efac, #f0fdf4)" },
    { id: "bg-space", name: "Weltraum", emoji: "\ud83d\ude80", slot: "bg", price: 22, bg: "linear-gradient(180deg, #0f172a, #312e81)" }
  ];

  function byId(id) { for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i]; return null; }

  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { s = null; }
    if (!s) s = { people: [], tasks: [] };
    if (!s.shop) s.shop = { owned: [], equipped: {}, spent: 0, name: "Momo" };
    if (!s.shop.owned) s.shop.owned = [];
    if (!s.shop.equipped) s.shop.equipped = {};
    if (typeof s.shop.spent !== "number") s.shop.spent = 0;
    if (!s.shop.name) s.shop.name = "Momo";
    return s;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function earned() {
    return (state.tasks || []).reduce(function (sum, t) {
      var c = t.counts || {};
      for (var k in c) if (Object.prototype.hasOwnProperty.call(c, k)) sum += c[k] || 0;
      return sum;
    }, 0);
  }
  function balance() { return Math.max(0, earned() - state.shop.spent); }
  function isOwned(id) { return state.shop.owned.indexOf(id) >= 0; }
  function isEquipped(id) {
    var e = state.shop.equipped;
    for (var k in e) if (e[k] === id) return true;
    return false;
  }

  var state = load();
  var filter = "all";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1700);
  }

  function sparkle() {
    var stage = document.getElementById("stage");
    var s = el("div", "sparkle", ["\u2728", "\u2b50", "\ud83d\udcab"][Math.floor(Math.random() * 3)]);
    s.style.left = (28 + Math.random() * 44) + "%";
    s.style.top = (30 + Math.random() * 40) + "%";
    stage.appendChild(s);
    setTimeout(function () { s.remove(); }, 900);
  }

  function celebrate() {
    var ch = document.getElementById("character");
    ch.classList.remove("bounce");
    void ch.offsetWidth;
    ch.classList.add("bounce");
    for (var i = 0; i < 10; i++) setTimeout(sparkle, i * 40);
  }

  function renderCoins() {
    document.getElementById("balance").textContent = String(balance());
    document.getElementById("earned").textContent = earned() + " verdient";
    document.getElementById("petname").textContent = state.shop.name || "Momo";
  }

  function renderCharacter() {
    var stage = document.getElementById("stage");
    var equipped = state.shop.equipped;
    var bg = DEFAULT_BG;
    var slots = document.querySelectorAll(".slot");
    for (var i = 0; i < slots.length; i++) slots[i].textContent = "";
    for (var slot in equipped) {
      if (!Object.prototype.hasOwnProperty.call(equipped, slot)) continue;
      var item = byId(equipped[slot]);
      if (!item) continue;
      if (slot === "bg") { if (item.bg) bg = item.bg; continue; }
      var node = document.querySelector('.slot[data-slot="' + slot + '"]');
      if (node) node.textContent = item.emoji;
    }
    stage.style.background = bg;
  }

  function renderFilters() {
    var nav = document.getElementById("filters");
    nav.innerHTML = "";
    CATS.forEach(function (c) {
      var b = el("button", c.slot === filter ? "active" : "", c.label);
      b.addEventListener("click", function () { filter = c.slot; renderFilters(); renderShop(); });
      nav.appendChild(b);
    });
  }

  function itemButton(item) {
    var owned = isOwned(item.id);
    var equipped = isEquipped(item.id);
    var b;
    if (!owned) {
      b = el("button", "buy" + (balance() < item.price ? " poor" : ""), "\ud83e\ude99 " + item.price);
      b.addEventListener("click", function () { buy(item); });
    } else if (equipped) {
      b = el("button", "equipped", "Ausziehen");
      b.addEventListener("click", function () { unequip(item); });
    } else {
      b = el("button", "owned", "Anziehen");
      b.addEventListener("click", function () { equip(item); });
    }
    return b;
  }

  function renderShop() {
    var shop = document.getElementById("shop");
    shop.innerHTML = "";
    ITEMS.filter(function (it) { return filter === "all" || it.slot === filter; })
      .forEach(function (item) {
        var card = el("div", "item" + (isOwned(item.id) ? " owned-item" : ""));
        card.appendChild(el("div", "pic", item.emoji));
        card.appendChild(el("div", "label", item.name));
        var cat = CATS.filter(function (c) { return c.slot === item.slot; })[0];
        card.appendChild(el("div", "cat", cat ? cat.label : ""));
        card.appendChild(itemButton(item));
        shop.appendChild(card);
      });
  }

  function buy(item) {
    if (isOwned(item.id)) { equip(item); return; }
    if (balance() < item.price) {
      toast("Zu wenig Coins \ud83e\ude99");
      var c = document.getElementById("coins");
      c.classList.remove("shake");
      void c.offsetWidth;
      c.classList.add("shake");
      return;
    }
    state.shop.spent += item.price;
    state.shop.owned.push(item.id);
    state.shop.equipped[item.slot] = item.id;
    save();
    render();
    celebrate();
    toast(item.name + " gekauft!");
  }

  function equip(item) {
    state.shop.equipped[item.slot] = item.id;
    save();
    render();
  }

  function unequip(item) {
    delete state.shop.equipped[item.slot];
    save();
    render();
  }

  function render() {
    renderCoins();
    renderCharacter();
    renderShop();
  }

  document.getElementById("petname").addEventListener("click", function () {
    var name = prompt("Name deines Sidekicks?", state.shop.name || "Momo");
    if (name === null) return;
    if (!name.trim()) return;
    state.shop.name = name.trim();
    save();
    renderCoins();
  });

  window.addEventListener("storage", function (e) {
    if (e.key === KEY) { state = load(); render(); }
  });
  window.addEventListener("focus", function () { state = load(); render(); });

  renderFilters();
  render();
})();
</script>
</body>
</html>
